<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07090c">
  <title>Matter Shift</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #07090c;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: Consolas, Menlo, 'Courier New', monospace;
    }
    #game-wrap { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; }
    #phaser-container { width: 100%; height: 100%; }
    /* Touch: Spielfeld zwischen zwei Steuerleisten, damit Buttons nichts verdecken */
    body.touch.ingame #game-wrap { left: calc(140px + env(safe-area-inset-left)); right: calc(140px + env(safe-area-inset-right)); }
    canvas { display: block; }

    /* ── Touch controls (nur bei Touch-Bedienung sichtbar) ───────────── */
    #ctrl { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    body.touch.ingame #ctrl, body.touch.ingame #btn-reset { display: block; }
    .btn {
      position: absolute;
      background: rgba(10, 16, 22, 0.28);
      border: 2px solid rgba(255, 255, 255, 0.28);
      border-radius: 16px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 24px;
      font-weight: bold;
      pointer-events: auto;
      touch-action: none;
      display: flex; align-items: center; justify-content: center;
      transition: background 60ms, transform 60ms;
    }
    .btn.on { background: rgba(255, 255, 255, 0.28); transform: scale(0.94); }
    #btn-left   { left:  calc(10px + env(safe-area-inset-left));  bottom: calc(14px + env(safe-area-inset-bottom)); width: 58px; height: 72px; }
    #btn-right  { left:  calc(74px + env(safe-area-inset-left));  bottom: calc(14px + env(safe-area-inset-bottom)); width: 58px; height: 72px; }
    #btn-jump   { right: calc(10px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 120px; height: 84px; border-radius: 42px; }
    #btn-freeze { right: calc(30px + env(safe-area-inset-right)); bottom: calc(112px + env(safe-area-inset-bottom)); width: 80px; height: 64px; border-radius: 32px;
                  border-color: rgba(0, 200, 255, 0.8); color: #7fe3ff; background: rgba(0, 120, 255, 0.18); }
    #btn-freeze.on { background: rgba(0, 200, 255, 0.45); }
    #btn-reset  { display: none; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top));
                  width: 44px; height: 44px; font-size: 20px; border-radius: 50%; z-index: 11; }

    #rotate {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: #07090c; color: #ff9900; font-size: 18px; letter-spacing: 2px;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
<div id="game-wrap"><div id="phaser-container"></div></div>

<div id="ctrl">
  <div class="btn" id="btn-left"   data-key="left">◀</div>
  <div class="btn" id="btn-right"  data-key="right">▶</div>
  <div class="btn" id="btn-freeze" data-key="freeze">❄</div>
  <div class="btn" id="btn-jump"   data-key="jump">▲</div>
</div>
<div class="btn" id="btn-reset">↻</div>
<div id="rotate">GERÄT DREHEN ↻<br><br>Matter Shift wird im Querformat gespielt.</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
'use strict';

// ─── SPIELER-KONFIG (hier anpassen) ──────────────────────────────────────────
const CFG = {
  SPEED:   236,    // Laufgeschwindigkeit
  JUMP:   -562,    // Sprunghöhe (negativer = höher)
  DJUMP:   0.8,    // Double Jump als Anteil des normalen Sprungs (0.5 = 50%)
  GRAVITY: 1342,   // Schwerkraft
  MAX_FALL: 900,   // Maximale Fallgeschwindigkeit des Spielers
  COYOTE_MS: 90,       // Sprung ist kurz nach Verlassen einer Kante noch möglich
  JUMP_BUFFER_MS: 120, // Sprung, der kurz vor der Landung gedrückt wird, wird gemerkt
  JUMP_CUT: 0.6,       // Taste früh loslassen = kürzerer Sprung (1 = aus)

  LIQUID_MAX_FALL: 260,   // Fallgeschwindigkeit flüssiger Plattformen (zähflüssig = gut timebar)
  COLUMN_MAX_FALL: 170,   // Fallgeschwindigkeit flüssiger Säulen
  COLUMN_TIP_SPEED: 36,   // Kippgeschwindigkeit der Säulen (Grad pro Sekunde)
  COLUMN_DRIFT: 40,       // Seitliche Drift kippender Säulen (px/s, in Schussrichtung)
  FREEZE_SNAP: 10,        // Gefrorene Plattformen rasten auf Bodenhöhe ein (px Toleranz)
};

// ─── Konstanten ──────────────────────────────────────────────────────────────
const GW = 1200, GH = 600;
const FLOOR_Y = GH - 55;
const CEIL_Y  = 55;
const WALL    = 20;
const FONT    = 'Consolas, Menlo, "Courier New", monospace';
const OUTLINE = 0x0b0f14;

const COL = {
  ORANGE: 0xff9900, HOT: 0xff6a00, COLD: 0x00c8ff, EXIT: 0x00ff88,
  DANGER: 0xff3344, AMBER: 0xffb000, STEEL: 0x222a32, STEEL_HI: 0x46525e,
};

// ─── Speicher (localStorage kann fehlen / blockiert sein) ────────────────────
const Store = {
  get(k, d) { try { const v = localStorage.getItem('matterShift.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('matterShift.' + k, JSON.stringify(v)); } catch (e) {} },
};

// ─── Sound (synthetisch, keine Dateien nötig) ────────────────────────────────
const SFX = {
  ctx: null, out: null, muted: Store.get('muted', false),
  resume() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.out = this.ctx.createGain(); this.out.gain.value = 0.32;
        this.out.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  toggle() { this.muted = !this.muted; Store.set('muted', this.muted); return this.muted; },
  tone(f0, f1, dur, type = 'square', vol = 0.25, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol = 0.2, freq = 1200, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.out);
    src.start(t);
  },
  play(name) {
    switch (name) {
      case 'jump':     this.tone(260, 520, 0.12, 'square', 0.10); break;
      case 'djump':    this.tone(420, 900, 0.14, 'square', 0.09); break;
      case 'land':     this.noise(0.07, 0.18, 300); break;
      case 'shoot':    this.tone(1100, 180, 0.22, 'sawtooth', 0.12); this.noise(0.15, 0.12, 2400); break;
      case 'miss':     this.tone(500, 260, 0.10, 'triangle', 0.10); break;
      case 'liquefy':  this.tone(160, 70, 0.45, 'sawtooth', 0.10, 0.04); this.noise(0.4, 0.10, 500, 0.04); break;
      case 'freeze':   this.tone(1500, 2400, 0.10, 'triangle', 0.12); this.tone(2200, 3000, 0.18, 'sine', 0.09, 0.05); this.noise(0.12, 0.10, 5000); break;
      case 'pickup':   [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0, 0.14, 'square', 0.09, i * 0.07)); break;
      case 'death':    this.tone(400, 60, 0.5, 'sawtooth', 0.14); this.noise(0.35, 0.22, 800); break;
      case 'win':      [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0, 0.2, 'triangle', 0.12, i * 0.08)); break;
      case 'click':    this.tone(800, 600, 0.05, 'square', 0.06); break;
    }
  },
};
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, () => SFX.resume(), { passive: true }));

// ─── Touch-Steuerung ─────────────────────────────────────────────────────────
// Touch-UI wird nur bei grobem Zeiger (Finger) oder nach der ersten Berührung
// gezeigt — Laptops mit Touchscreen behalten Maus-Bedienung.
let TOUCH_UI = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
function refreshLayout() {
  const r = () => { try { window.__game && window.__game.scale.refresh(); } catch (e) {} };
  requestAnimationFrame(r); setTimeout(r, 60); setTimeout(r, 300);
}
window.addEventListener('orientationchange', refreshLayout);
function setInGame(on) { document.body.classList.toggle('ingame', on); refreshLayout(); }
function setTouchUI(on) { TOUCH_UI = on; document.body.classList.toggle('touch', on); refreshLayout(); }
setTouchUI(TOUCH_UI);
window.addEventListener('touchstart', () => { if (!TOUCH_UI) setTouchUI(true); }, { passive: true, capture: true });
window.addEventListener('mousemove', e => {
  // echte Maus bewegt → wieder Maus-UI (Touch-Events lösen kein mousemove mit movementX aus)
  if (TOUCH_UI && (e.movementX || e.movementY) && !(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) setTouchUI(false);
});

const MOBILE = { left: false, right: false, jump: false, freeze: false, reset: false };
const touchKeys = new Map();
function keyAtPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  const b = el && el.closest ? el.closest('#ctrl [data-key]') : null;
  return b ? b.dataset.key : null;
}
function syncTouch() {
  const act = new Set(touchKeys.values());
  ['left', 'right', 'jump', 'freeze'].forEach(k => {
    MOBILE[k] = act.has(k);
    const el = document.querySelector(`#ctrl [data-key="${k}"]`);
    if (el) el.classList.toggle('on', MOBILE[k]);
  });
}
function onCtrlTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (e.type === 'touchend' || e.type === 'touchcancel') touchKeys.delete(t.identifier);
    else touchKeys.set(t.identifier, keyAtPoint(t.clientX, t.clientY)); // Finger darf zwischen Buttons gleiten
  }
  syncTouch();
}
const ctrlEl = document.getElementById('ctrl');
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(ev => ctrlEl.addEventListener(ev, onCtrlTouch, { passive: false }));
const resetEl = document.getElementById('btn-reset');
resetEl.addEventListener('touchstart', e => { e.preventDefault(); MOBILE.reset = true; }, { passive: false });
resetEl.addEventListener('click', () => { MOBILE.reset = true; });
window.addEventListener('blur', () => { touchKeys.clear(); syncTouch(); });

// ─── Helfer ──────────────────────────────────────────────────────────────────
class RNG {
  constructor(seed) { this.s = ((seed % 2147483646) + 2147483646) % 2147483646 + 1; }
  next() { this.s = this.s * 16807 % 2147483647; return (this.s - 1) / 2147483646; }
  f(a, b) { return a + this.next() * (b - a); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
}

function rayAABB(ox, oy, dx, dy, x0, y0, x1, y1) {
  let tIn = -1e9, tOut = 1e9;
  if (Math.abs(dx) > 1e-9) {
    const t1 = (x0 - ox) / dx, t2 = (x1 - ox) / dx;
    tIn = Math.max(tIn, Math.min(t1, t2)); tOut = Math.min(tOut, Math.max(t1, t2));
  } else if (ox < x0 || ox > x1) return null;
  if (Math.abs(dy) > 1e-9) {
    const t1 = (y0 - oy) / dy, t2 = (y1 - oy) / dy;
    tIn = Math.max(tIn, Math.min(t1, t2)); tOut = Math.min(tOut, Math.max(t1, t2));
  } else if (oy < y0 || oy > y1) return null;
  if (tIn > tOut || tOut < 0) return null;
  return { t: Math.max(0, tIn), inside: tIn < 0 };
}

function rectsOverlap(a, b, m = 0) {
  return a.x < b.x + b.w + m && a.x + a.w + m > b.x && a.y < b.y + b.h + m && a.y + a.h + m > b.y;
}

// Abgerundetes Rechteck, Radius wird auf gültige Größe begrenzt
function rr(g, x, y, w, h, r, stroke) {
  r = Math.max(0, Math.min(r, w / 2 - 0.01, h / 2 - 0.01));
  if (r < 1) { stroke ? g.strokeRect(x, y, w, h) : g.fillRect(x, y, w, h); }
  else       { stroke ? g.strokeRoundedRect(x, y, w, h, r) : g.fillRoundedRect(x, y, w, h, r); }
}

const hintText = s => s
  .replace(/\{SHOOT\}/g,  TOUCH_UI ? 'Tippe' : 'Linksklick')
  .replace(/\{FREEZE\}/g, TOUCH_UI ? '❄ drücken' : 'Rechtsklick / F')
  .replace(/\{RESET\}/g,  TOUCH_UI ? '↻' : 'R')
  .replace(/\{MOVE\}/g,   TOUCH_UI ? '◀ ▶' : 'A / D');

// ─── Level ───────────────────────────────────────────────────────────────────
// floor:  begehbare Bodenabschnitte [x0, x1] — Lücken dazwischen sind Abgründe
// blocks: feste, nicht veränderbare Blöcke (z.B. Simse)
// plats:  veränderbare Plattformen  (State Gun)
// cols:   veränderbare Säulen        (kippen in Schussrichtung)
const LEVELS = [
  {
    name: 'AUFNAHME',
    floor: [[WALL, 470], [930, GW - WALL]],
    plats: [{ x: 620, y: 170, w: 160 }],
    gun: { x: 300 },
    exit: { x: 1090 },
    hints: {
      start:   'Hol dir die STATE GUN   ·   {MOVE} laufen, W / Leertaste springen',
      gun:     '{SHOOT} auf die Plattform über dem Abgrund',
      liquefy: 'Sie fließt! {FREEZE}, wenn sie auf Bodenhöhe ist',
      freeze:  'Brücke steht — weiter zum AUSGANG',
      retry:   'Zu weit zum Springen — bau dir eine Brücke!',
    },
  },
  {
    name: 'SÄULENSTURZ',
    floor: [[WALL, 440], [920, GW - WALL]],
    cols: [{ x: 560, y: CEIL_Y, h: 220 }],
    exit: { x: 1090 },
    hints: {
      start:   'Säulen kippen in Schussrichtung — schieß von links',
      liquefy: 'Warte, bis sie fast waagerecht liegt …',
      freeze:  'Gefroren bleibt sie liegen. Rüber!',
      retry:   'Gefriere die Säule erst, wenn sie quer über dem Abgrund liegt',
    },
  },
  {
    name: 'AUFSTIEG',
    floor: [[WALL, GW - WALL]],
    blocks: [{ x: 900, y: 300, w: GW - WALL - 900, h: FLOOR_Y - 300 }],
    plats: [{ x: 700, y: 120, w: 150 }],
    exit: { x: 1050, y: 300 },
    hints: {
      start:   'Zu hoch zum Springen — bau dir eine Stufe',
      liquefy: 'Auf halber Höhe einfrieren',
      freeze:  'Doppelsprung: in der Luft nochmal springen',
    },
  },
  {
    name: 'DOPPELT',
    floor: [[WALL, 380], [820, GW - WALL]],
    blocks: [{ x: 1000, y: 330, w: GW - WALL - 1000, h: FLOOR_Y - 330 }],
    plats: [{ x: 520, y: 150, w: 160 }, { x: 840, y: 110, w: 140 }],
    exit: { x: 1090, y: 330 },
    hints: {
      start:   'Erst die Brücke, dann die Stufe',
      liquefy: 'Tipp: {SHOOT} auf Flüssiges friert nur dieses Stück ein',
    },
  },
  {
    name: 'KETTENREAKTION',
    floor: [[WALL, 300], [860, GW - WALL]],
    cols:  [{ x: 420, y: CEIL_Y, h: 240 }],
    plats: [{ x: 690, y: 130, w: 140 }],
    exit:  { x: 1090 },
    hints: {
      start: 'Ein Abgrund, zwei Bauteile',
      lost:  'Material verloren — {RESET} setzt die Kammer zurück',
    },
  },
];

const PROC_NAMES = ['DRUCKPROBE', 'PHASENGRENZE', 'KONDENSAT', 'SCHMELZPUNKT', 'KRISTALLGITTER',
  'VISKOSITÄT', 'ERSTARRUNG', 'AGGREGAT', 'SUBLIMATION', 'DICHTEFELD', 'TRIPELPUNKT', 'HYSTERESE'];

// Prozedurale Kammern ab Level 6 — mit Lösbarkeitsgarantie:
// Abgrund immer breiter als ein Doppelsprung (sonst ist die Waffe überflüssig),
// aber immer mindestens ein Bauteil, das als Brücke taugt.
function genLevel(num) {
  const rng = new RNG(num * 97531 + 13);
  const L = { name: rng.pick(PROC_NAMES), floor: [], blocks: [], plats: [], cols: [], hints: {} };

  const hasLedge = num >= 7 && rng.next() < 0.55;
  const ledgeX   = hasLedge ? Math.round(rng.f(GW - 300, GW - 250)) : GW - WALL;
  const ledgeTop = hasLedge ? Math.round(FLOOR_Y - rng.f(200, 230)) : FLOOR_Y;

  const pitMinX  = 260;
  const maxPitW  = (hasLedge ? ledgeX - 190 : GW - 240) - pitMinX;
  const pitW     = Math.round(Math.min(maxPitW, rng.f(420, 420 + Math.min(40 + num * 8, 120))));
  const pitX     = Math.round(rng.f(pitMinX, Math.max(pitMinX, (hasLedge ? ledgeX - 190 : GW - 240) - pitW)));
  L.floor = [[WALL, pitX], [pitX + pitW, GW - WALL]];
  if (hasLedge) L.blocks.push({ x: ledgeX, y: ledgeTop, w: GW - WALL - ledgeX, h: FLOOR_Y - ledgeTop });
  L.exit = hasLedge ? { x: Math.round((ledgeX + GW - WALL) / 2), y: ledgeTop } : { x: GW - 100 };

  // Brückenbauteil über dem Abgrund
  if (num >= 6 && rng.next() < 0.45) {
    L.cols.push({ x: Math.round(pitX + rng.f(40, 80)), y: CEIL_Y, h: Math.round(rng.f(210, 240)) });
    L.plats.push({ x: Math.round(pitX + pitW - 170), y: Math.round(rng.f(110, 170)), w: 140 }); // Reserve
  } else {
    const w = Math.round(rng.f(150, 190));
    L.plats.push({ x: Math.round(pitX + pitW / 2 - w / 2 + rng.f(-40, 40)), y: Math.round(rng.f(110, 250)), w });
  }
  // Stufe vor dem Sims
  if (hasLedge) L.plats.push({ x: Math.round(ledgeX - rng.f(150, 165)), y: Math.round(rng.f(100, 150)), w: 140 });

  // Zusätzliche Bauteile (überschneiden sich nicht, blockieren Start/Ausgang nicht)
  const taken = [
    ...L.plats.map(p => ({ x: p.x, y: p.y, w: p.w, h: 20 })),
    ...L.cols.map(c => ({ x: c.x, y: c.y, w: 22, h: c.h })),
    ...L.blocks,
    { x: WALL, y: FLOOR_Y - 200, w: 220, h: 200 },                     // Startbereich
    { x: L.exit.x - 90, y: L.exit.y - 170, w: 180, h: 170 },            // Ausgang
  ];
  const extra = Math.min(1 + Math.floor(num / 3), 4);
  for (let i = 0, tries = 0; i < extra && tries < 80; tries++) {
    const w = Math.round(rng.f(80, 150));
    const r = { x: Math.round(rng.f(60, GW - 60 - w)), y: Math.round(rng.f(CEIL_Y + 50, FLOOR_Y - 220)), w, h: 20 };
    if (taken.some(t => rectsOverlap(r, t, 30))) continue;
    taken.push(r); L.plats.push({ x: r.x, y: r.y, w: r.w }); i++;
  }
  if (num >= 8) {
    for (let i = 0, tries = 0; i < Math.min(Math.floor((num - 6) / 3), 2) && tries < 60; tries++) {
      const h = Math.round(rng.f(100, 170));
      const r = { x: Math.round(rng.f(260, GW - 300)), y: CEIL_Y, w: 22, h };
      if (taken.some(t => rectsOverlap(r, t, 40))) continue;
      taken.push(r); L.cols.push({ x: r.x, y: r.y, h }); i++;
    }
  }
  return L;
}

function getLevel(num) {
  const src = num <= LEVELS.length ? LEVELS[num - 1] : genLevel(num);
  return {
    name: src.name,
    floor: src.floor,
    blocks: src.blocks || [],
    plats: src.plats || [],
    cols: src.cols || [],
    gun: src.gun ? { x: src.gun.x, y: src.gun.y ?? FLOOR_Y } : null,
    start: { x: (src.start && src.start.x) || 100, y: (src.start && src.start.y) || FLOOR_Y },
    exit: { x: src.exit.x, y: src.exit.y ?? FLOOR_Y },
    hints: src.hints || {},
  };
}

// ─── Zeichnen ────────────────────────────────────────────────────────────────
// Alle veränderbaren Teile werden um (0,0) gezeichnet, damit Drehen funktioniert.
function drawStateful(g, w, h, isCol) {
  const hw = w / 2, hh = h / 2;
  g.fillStyle(0x000000, 0.28); rr(g, -hw + 4, -hh + 5, w, h, 3);
  g.fillStyle(0x36424d); rr(g, -hw, -hh, w, h, 3);
  if (!isCol) {
    g.fillStyle(0x56636f); g.fillRect(-hw + 2, -hh + 2, w - 4, 3);
    g.fillStyle(0x232c34); g.fillRect(-hw + 2, hh - 4, w - 4, 2);
    g.fillStyle(0x1e262d); g.fillRect(-hw + 2, -hh + 2, 6, h - 4); g.fillRect(hw - 8, -hh + 2, 6, h - 4);
    g.fillStyle(COL.HOT, 0.22); g.fillRect(-hw + 12, -3, w - 24, 7);
    g.fillStyle(0xff8a2a, 0.95); g.fillRect(-hw + 14, 0, w - 28, 2);
    g.fillStyle(0xffc27a, 0.9);
    for (let x = -hw + 20; x < hw - 18; x += 24) g.fillRect(x, -1, 2, 4);
  } else {
    g.fillStyle(0x56636f); g.fillRect(-hw + 2, -hh + 2, 3, h - 4);
    g.fillStyle(0x232c34); g.fillRect(hw - 4, -hh + 2, 2, h - 4);
    g.fillStyle(COL.HOT, 0.22); g.fillRect(-3, -hh + 10, 7, h - 20);
    g.fillStyle(0xff8a2a, 0.95); g.fillRect(0, -hh + 12, 2, h - 24);
    g.fillStyle(0x1e262d);
    for (let y = -hh + 30; y < hh - 10; y += 34) g.fillRect(-hw + 2, y, w - 4, 3);
  }
  g.lineStyle(2, OUTLINE, 1); rr(g, -hw, -hh, w, h, 3, true);
}

function drawFrozen(g, w, h, seed) {
  const hw = w / 2, hh = h / 2;
  g.fillStyle(0x7fdcff, 0.10); rr(g, -hw - 5, -hh - 5, w + 10, h + 10, 7);
  g.fillStyle(0x235d7e); rr(g, -hw, -hh, w, h, 3);
  g.fillStyle(0x4fb6e0, 0.55);
  if (w >= h) g.fillRect(-hw + 1, -hh + 1, w - 2, Math.max(2, h * 0.45));
  else        g.fillRect(-hw + 1, -hh + 1, Math.max(2, w * 0.45), h - 2);
  const r = new RNG(seed);
  g.lineStyle(1, 0xd8f6ff, 0.4);
  const n = Math.floor((w + h) / 16);
  for (let i = 0; i < n; i++) {
    const x = -hw + r.f(3, w - 3), y = -hh + r.f(2, h - 2);
    const a = r.f(0, Math.PI), L = r.f(4, 12);
    const x2 = Phaser.Math.Clamp(x + Math.cos(a) * L, -hw + 2, hw - 2);
    const y2 = Phaser.Math.Clamp(y + Math.sin(a) * L, -hh + 2, hh - 2);
    g.lineBetween(x, y, x2, y2);
  }
  g.fillStyle(0xeefbff, 0.95); g.fillRect(-hw + 1, -hh, w - 2, 2);
  if (w > h) {
    for (let x = -hw + 6; x < hw - 4; x += r.f(9, 16)) g.fillCircle(x, -hh + 1, r.f(1.2, 2.6));
  }
  g.lineStyle(2, 0xa8ecff, 1); rr(g, -hw, -hh, w, h, 3, true);
}

function wobblyRect(hw, hh, amp, phase) {
  const pts = [], step = 6; let s = 0;
  const push = (x, y, nx, ny) => { const o = amp * Math.sin(s * 0.12 + phase); pts.push({ x: x + nx * o, y: y + ny * o }); s += step; };
  for (let x = -hw; x < hw; x += step) push(x, -hh, 0, -1);
  for (let y = -hh; y < hh; y += step) push(hw, y, 1, 0);
  for (let x = hw; x > -hw; x -= step) push(x, hh, 0, 1);
  for (let y = hh; y > -hh; y -= step) push(-hw, y, -1, 0);
  return pts;
}

function drawLiquid(g, w, h, t, seed) {
  const hw = w / 2, hh = h / 2;
  const amp = Math.min(2.6, Math.min(w, h) * 0.22);
  g.fillStyle(COL.HOT, 0.08); rr(g, -hw - 8, -hh - 8, w + 16, h + 16, 12);
  g.fillStyle(COL.HOT, 0.14); rr(g, -hw - 4, -hh - 4, w + 8, h + 8, 8);
  const pts = wobblyRect(hw, hh, amp, t * 6 + seed);
  g.fillStyle(0xc7400c, 0.97); g.fillPoints(pts, true);
  g.fillStyle(0xff8a1f, 0.95);
  if (w >= h) g.fillRect(-hw + 3, -hh + 1 + Math.sin(t * 4 + seed) * 0.8, w - 6, Math.max(2, h * 0.32));
  else        g.fillRect(-hw + 1, -hh + 3, Math.max(2, w * 0.32), h - 6);
  g.fillStyle(0xffd27a, 0.85);
  const long = Math.max(w, h), n = Math.max(2, Math.floor(long / 22));
  for (let i = 0; i < n; i++) {
    const s = ((i * 37 + seed * 13) % long + t * (14 + i % 3 * 6)) % long - long / 2;
    const o = Math.sin(t * 3 + i * 2.1) * (Math.min(w, h) * 0.22);
    if (w >= h) g.fillCircle(s, o, 1.5); else g.fillCircle(o, s, 1.5);
  }
  g.lineStyle(2, 0x5a1a02, 0.9); g.strokePoints(pts, true);
}

// BOOT — Texturen einmalig erzeugen
// ═══════════════════════════════════════════════════════════════════════════════
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }

  create() {
    const g = this.make.graphics({ add: false });
    g.fillStyle(0xffffff); g.fillRect(0, 0, 1, 1); g.generateTexture('px', 1, 1); g.clear();
    g.fillStyle(0xffffff); g.fillRect(0, 0, 3, 3); g.generateTexture('sq', 3, 3); g.clear();
    g.fillStyle(0xffffff); g.fillPoints([{ x: 3, y: 0 }, { x: 6, y: 3 }, { x: 3, y: 8 }, { x: 0, y: 3 }], true);
    g.generateTexture('shard', 6, 8); g.destroy();

    this._softDot();
    this._pitGlow();
    this._background();
    this._player();
    this.scene.start('Menu');
  }

  _softDot() {
    const t = this.textures.createCanvas('dot', 16, 16), c = t.getContext();
    const gr = c.createRadialGradient(8, 8, 0, 8, 8, 8);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,0.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = gr; c.fillRect(0, 0, 16, 16); t.refresh();
  }

  _pitGlow() {
    const t = this.textures.createCanvas('pitglow', 4, 128), c = t.getContext();
    const gr = c.createLinearGradient(0, 0, 0, 128);
    gr.addColorStop(0, 'rgba(255,60,30,0)'); gr.addColorStop(0.6, 'rgba(255,70,30,0.35)'); gr.addColorStop(1, 'rgba(255,120,40,0.95)');
    c.fillStyle = gr; c.fillRect(0, 0, 4, 128); t.refresh();
  }

  // Betonwand mit Paneelen, Lichtkegeln und Vignette (Farbwelt #494a48 / #9da19c)
  _background() {
    const t = this.textures.createCanvas('bg', GW, GH), c = t.getContext();
    const base = c.createLinearGradient(0, 0, 0, GH);
    base.addColorStop(0, '#454744'); base.addColorStop(1, '#2a2c2a');
    c.fillStyle = base; c.fillRect(0, 0, GW, GH);

    const rng = new RNG(42);
    const PW = 150, PH = 110;
    for (let y = 20; y < GH; y += PH) {
      for (let x = (Math.floor(y / PH) % 2) * -PW / 2; x < GW; x += PW) {
        const v = Math.floor(rng.f(-6, 6));
        const shade = 74 + v;
        c.fillStyle = `rgba(${shade},${shade + 2},${shade},0.55)`;
        c.fillRect(x + 3, y + 3, PW - 6, PH - 6);
        c.fillStyle = 'rgba(157,161,156,0.10)'; c.fillRect(x + 3, y + 3, PW - 6, 2);
        c.fillStyle = 'rgba(0,0,0,0.22)';       c.fillRect(x + 3, y + PH - 5, PW - 6, 2);
        c.fillStyle = 'rgba(0,0,0,0.25)';
        [[x + 10, y + 10], [x + PW - 12, y + 10], [x + 10, y + PH - 12], [x + PW - 12, y + PH - 12]]
          .forEach(([bx, by]) => { c.beginPath(); c.arc(bx, by, 2, 0, Math.PI * 2); c.fill(); });
        if (rng.next() < 0.12) { // Kammer-Markierungen
          c.fillStyle = 'rgba(255,153,0,0.10)'; c.fillRect(x + 18, y + PH / 2 - 2, PW - 36, 4);
        }
      }
    }
    // Lichtkegel der Deckenlampen
    [240, 600, 960].forEach(lx => {
      const gr = c.createRadialGradient(lx, CEIL_Y, 10, lx, CEIL_Y + 60, 380);
      gr.addColorStop(0, 'rgba(255,240,210,0.20)'); gr.addColorStop(1, 'rgba(255,240,210,0)');
      c.fillStyle = gr; c.fillRect(0, 0, GW, GH);
    });
    // Vignette
    const vg = c.createRadialGradient(GW / 2, GH / 2, GH * 0.35, GW / 2, GH / 2, GW * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    c.fillStyle = vg; c.fillRect(0, 0, GW, GH);
    t.refresh();
  }

  _player() {
    // Frames 32×52, Füße unten, Blick nach rechts
    const frames = {
      idle: [[10, 38, 13], [17, 38, 13]],
      run1: [[6, 37, 13], [20, 38, 12]],
      run2: [[12, 38, 13], [15, 37, 13]],
      jump: [[9, 36, 11], [18, 38, 9]],
      fall: [[8, 39, 12], [19, 38, 13]],
    };
    Object.entries(frames).forEach(([name, legs]) => {
      const g = this.make.graphics({ add: false });
      g.lineStyle(2, OUTLINE);
      // Rucksack-Tank
      g.fillStyle(0x6b7785); rr(g, 4, 22, 7, 14, 2); rr(g, 4, 22, 7, 14, 2, true);
      g.fillStyle(COL.HOT); g.fillRect(6, 25, 3, 4);
      // Beine
      legs.forEach(([x, y, h]) => {
        g.fillStyle(0xdfe7ee); g.fillRect(x, y, 6, h); g.strokeRect(x, y, 6, h);
        g.fillStyle(0x3a444e); g.fillRect(x, y + h - 3, 6, 3);
      });
      // Körper
      g.fillStyle(0xe6edf3); rr(g, 9, 21, 15, 18, 3); rr(g, 9, 21, 15, 18, 3, true);
      g.fillStyle(COL.HOT); g.fillRect(10, 32, 13, 3);
      g.fillStyle(COL.COLD); g.fillRect(19, 25, 3, 3);
      // Helm
      g.fillStyle(0xe6edf3); rr(g, 9, 4, 16, 17, 5); rr(g, 9, 4, 16, 17, 5, true);
      g.fillStyle(0x1e90ff); rr(g, 15, 8, 11, 8, 3);
      g.lineStyle(1.5, OUTLINE); rr(g, 15, 8, 11, 8, 3, true);
      g.fillStyle(0xffffff, 0.7); g.fillRect(17, 10, 3, 2);
      g.generateTexture('p_' + name, 32, 52); g.destroy();
    });

    // Waffenarm (Drehpunkt = Schulter)
    let g = this.make.graphics({ add: false });
    g.lineStyle(2, OUTLINE);
    g.fillStyle(0xe6edf3); g.fillRect(1, 5, 10, 6); g.strokeRect(1, 5, 10, 6);
    g.fillStyle(0xffc21a); rr(g, 9, 2, 16, 11, 2); rr(g, 9, 2, 16, 11, 2, true);
    g.fillStyle(COL.COLD); g.fillRect(13, 4, 2, 7);
    g.fillStyle(0x9aa4ad); g.fillRect(24, 5, 8, 5); g.strokeRect(24, 5, 8, 5);
    g.fillStyle(COL.ORANGE); g.fillCircle(32, 7.5, 2.5);
    g.generateTexture('gunarm', 36, 15); g.destroy();

    g = this.make.graphics({ add: false });
    g.lineStyle(2, OUTLINE);
    g.fillStyle(0xe6edf3); g.fillRect(1, 2, 11, 6); g.strokeRect(1, 2, 11, 6);
    g.fillStyle(0x3a444e); g.fillRect(11, 2, 4, 6); g.strokeRect(11, 2, 4, 6);
    g.generateTexture('arm', 17, 10); g.destroy();
  }
}

// MENU
// ═══════════════════════════════════════════════════════════════════════════════
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  create() {
    setInGame(false);
    this.cameras.main.fadeIn(350, 0, 0, 0);
    this.add.image(0, 0, 'bg').setOrigin(0);
    const ov = this.add.graphics();
    ov.fillStyle(0x05080c, 0.5); ov.fillRect(0, 0, GW, GH);
    ov.fillStyle(COL.HOT, 0.06);  ov.fillRect(0, 0, 90, GH);
    ov.fillStyle(COL.COLD, 0.06); ov.fillRect(GW - 90, 0, 90, GH);
    ov.lineStyle(2, COL.ORANGE, 0.6); ov.strokeRect(14, 14, GW - 28, GH - 28);
    ov.lineStyle(1, COL.COLD, 0.35);  ov.strokeRect(20, 20, GW - 40, GH - 40);

    this.add.particles(0, 0, 'dot', {
      x: { min: 0, max: GW }, y: GH + 10, lifespan: 7000,
      speedY: { min: -45, max: -15 }, speedX: { min: -8, max: 8 },
      scale: { start: 0.55, end: 0 }, alpha: { start: 0.7, end: 0 },
      tint: [COL.ORANGE, COL.COLD], blendMode: 'ADD', frequency: 140,
    });

    this._logo(GW / 2, 132, 58);

    const t1 = this.add.text(0, 258, 'MATTER', { fontFamily: FONT, fontSize: '78px', fontStyle: 'bold', color: '#ff9900', stroke: '#000', strokeThickness: 8 }).setOrigin(0, 0.5);
    const t2 = this.add.text(0, 258, 'SHIFT',  { fontFamily: FONT, fontSize: '78px', fontStyle: 'bold', color: '#00c8ff', stroke: '#000', strokeThickness: 8 }).setOrigin(0, 0.5);
    const total = t1.width + 26 + t2.width;
    t1.x = GW / 2 - total / 2; t2.x = t1.x + t1.width + 26;
    this.add.text(GW / 2, 318, 'STATE GUN  ·  MOLEKULARE DICHTEMANIPULATION', {
      fontFamily: FONT, fontSize: '15px', color: '#a9bccb', letterSpacing: 2,
    }).setOrigin(0.5);

    const best = Math.max(1, Store.get('best', 1));
    const start = (lvl, fresh) => {
      if (this._starting) return;
      this._starting = true;
      SFX.resume(); SFX.play('click');
      if (fresh) Store.set('best', 1);
      this.cameras.main.fadeOut(250, 0, 0, 0);
      this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Game', { level: lvl, deaths: 0 }));
    };
    if (best > 1) {
      this._button(GW / 2, 385, `▶  WEITER  ·  KAMMER ${String(best).padStart(2, '0')}`, true, () => start(best, false));
      this._button(GW / 2, 440, 'NEUES SPIEL', false, () => start(1, true));
    } else {
      this._button(GW / 2, 400, '▶  TEST STARTEN', true, () => start(1, false));
    }

    const legend = TOUCH_UI
      ? ['◀ ▶  laufen    ▲  springen (2× = Doppelsprung)',
         'TIPPEN  State Gun: verflüssigen / gezielt einfrieren    ❄  alles einfrieren    ↻  Neustart']
      : ['A D / ← →  laufen     W / ␣  springen (2× = Doppelsprung)     R  Neustart     M  Ton     ESC  Menü',
         'LINKSKLICK  verflüssigen / Flüssiges gezielt einfrieren      RECHTSKLICK / F  alles einfrieren'];
    legend.forEach((l, i) => this.add.text(GW / 2, 510 + i * 22, l, { fontFamily: FONT, fontSize: '13px', color: '#8ea3b4' }).setOrigin(0.5));
    this.add.text(GW / 2, 568, TOUCH_UI ? '' : '[ LEERTASTE / ENTER ]', { fontFamily: FONT, fontSize: '12px', color: '#5d7385' }).setOrigin(0.5);

    this.input.keyboard.on('keydown-SPACE', () => start(best, false));
    this.input.keyboard.on('keydown-ENTER', () => start(best, false));
    this.input.keyboard.on('keydown-N',     () => start(1, true));
    this.input.keyboard.on('keydown-M',     () => SFX.toggle());
  }

  _button(x, y, label, primary, cb) {
    const txt = this.add.text(x, y, label, {
      fontFamily: FONT, fontSize: primary ? '22px' : '16px', fontStyle: 'bold',
      color: primary ? '#ffffff' : '#b9c7d2',
    }).setOrigin(0.5).setDepth(2);
    const w = Math.max(260, txt.width + 60), h = primary ? 48 : 38;
    const g = this.add.graphics().setDepth(1);
    const draw = hover => {
      g.clear();
      g.fillStyle(primary ? COL.HOT : 0x1a232c, hover ? 0.95 : (primary ? 0.75 : 0.8));
      rr(g, x - w / 2, y - h / 2, w, h, 8);
      g.lineStyle(2, primary ? 0xffc27a : 0x56636f, hover ? 1 : 0.7);
      rr(g, x - w / 2, y - h / 2, w, h, 8, true);
    };
    draw(false);
    const zone = this.add.zone(x, y, w, h).setInteractive({ useHandCursor: true });
    zone.on('pointerover', () => draw(true));
    zone.on('pointerout',  () => draw(false));
    zone.on('pointerdown', cb);
    if (primary) this.tweens.add({ targets: txt, scale: { from: 1, to: 1.04 }, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
  }

  _logo(cx, cy, r) {
    const g = this.add.graphics({ x: cx, y: cy });   // um eigenen Mittelpunkt drehen
    g.fillStyle(COL.ORANGE, 0.12); g.fillCircle(0, 0, r);
    g.lineStyle(3, COL.ORANGE); g.strokeCircle(0, 0, r);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      g.lineStyle(3, COL.ORANGE);
      g.lineBetween(Math.cos(a) * r * 0.38, Math.sin(a) * r * 0.38, Math.cos(a) * r, Math.sin(a) * r);
      g.fillStyle(COL.COLD, 0.95); g.fillCircle(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7, 5);
    }
    g.fillStyle(0x1a1c1b); g.fillCircle(0, 0, r * 0.32);
    g.lineStyle(3, COL.ORANGE); g.strokeCircle(0, 0, r * 0.32);
    g.fillStyle(COL.COLD, 0.9); g.fillCircle(0, 0, 7);
    this.tweens.add({ targets: g, angle: 360, duration: 14000, repeat: -1 });
  }
}

// GAME
// ═══════════════════════════════════════════════════════════════════════════════
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init(data) {
    this.levelNum  = data.level || 1;
    this.deaths    = data.deaths || 0;
    this.retry     = !!data.retry;
    this.hasGun    = data.hasGun !== undefined ? data.hasGun : this.levelNum > 1;
    this.levelDone = false;
    this.dead      = false;
    this._leaving  = false;   // Szene-Instanz wird wiederverwendet → sonst blockiert "weiter" ab Level 2
    this.platObjects = [];
    this.statics     = [];
    this.pits        = [];
    this._t          = 0;
    this._levelTime  = 0;
    this._freezeCD   = 0;
    this._shootCD    = 0;
    this._coyote     = 0;
    this._jumpBuf    = 0;
    this._airJumps   = 0;
    this._jumpHeld   = true;   // gehaltene Taste aus dem Menü nicht als Sprung werten
    this._jumping    = false;
    this._prevFreeze = true;
    this._wasGrounded = true;
    this._lastVy     = 0;
    this._runT       = 0;
    this._sx = 1; this._sy = 1;
    this.facing      = 1;
    this._touchAim   = null;
    this._hintsShown = {};
  }

  create() {
    setInGame(true);
    MOBILE.reset = false;
    const L = getLevel(this.levelNum);
    this.L = L;

    this.add.image(0, 0, 'bg').setOrigin(0).setDepth(0);
    this.platGroup = this.physics.add.staticGroup();

    this._buildStatics(L);
    this._buildFx();
    this._buildStateful(L);
    this._buildExit(L.exit);
    if (L.gun && !this.hasGun) this._buildGunPickup(L.gun);

    // Physik-Körper des Spielers: unsichtbar & unskaliert (Skalierung würde den Body verzerren)
    this.player = this.physics.add.sprite(L.start.x, L.start.y - 25, 'px').setVisible(false);
    this.player.body.setSize(20, 50, true);
    this.player.body.setMaxVelocity(2000, CFG.MAX_FALL);
    this.physics.add.collider(this.player, this.platGroup);

    this.pv   = this.add.sprite(L.start.x, L.start.y, 'p_idle').setOrigin(0.5, 1).setDepth(20);
    this.parm = this.add.image(L.start.x, L.start.y - 27, this.hasGun ? 'gunarm' : 'arm').setOrigin(4 / 36, 0.5).setDepth(21);

    this.beamGfx = this.add.graphics().setDepth(30);
    this.aimGfx  = this.add.graphics().setDepth(35);
    this.xhGfx   = this.add.graphics().setDepth(40);
    this.aimLbl  = this.add.text(0, 0, '', { fontFamily: FONT, fontSize: '11px', color: '#ffffff', stroke: '#000', strokeThickness: 3 }).setDepth(40);

    this._buildHUD();
    this._setupInput();

    this.cameras.main.fadeIn(300, 0, 0, 0);
    this._banner();
    const first = this.retry && L.hints.retry ? 'retry' : 'start';
    this.time.delayedCall(this.retry ? 200 : 1300, () => this._hint(first));
  }

  // ── Statische Geometrie ──────────────────────────────────────────────────────
  _buildStatics(L) {
    const add = (x, y, w, h, kind) => {
      const r = { x, y, w, h, kind };
      this.statics.push(r);
      this.platGroup.create(x + w / 2, y + h / 2, 'px').setVisible(false).setDisplaySize(w, h).refreshBody();
      return r;
    };
    add(0, 0, WALL, GH, 'wall');
    add(GW - WALL, 0, WALL, GH, 'wall');
    add(WALL, 0, GW - 2 * WALL, CEIL_Y, 'ceil');
    const floors = L.floor.map(([a, b]) => add(a, FLOOR_Y, b - a, GH - FLOOR_Y + 40, 'floor'));
    L.blocks.forEach(b => add(b.x, b.y, b.w, b.h, 'block'));

    // Abgründe = Lücken zwischen Bodenstücken
    const segs = [...L.floor].sort((a, b) => a[0] - b[0]);
    let x = WALL;
    segs.forEach(([a, b]) => { if (a > x) this.pits.push({ x, w: a - x }); x = Math.max(x, b); });
    if (x < GW - WALL) this.pits.push({ x, w: GW - WALL - x });

    // Abgrund-Optik: dunkles Loch + Zersetzungsfeld-Glühen
    const pg = this.add.graphics().setDepth(1);
    this.pits.forEach(p => {
      pg.fillStyle(0x000000, 0.55); pg.fillRect(p.x, FLOOR_Y, p.w, GH - FLOOR_Y);
      const glow = this.add.image(p.x, FLOOR_Y + 5, 'pitglow').setOrigin(0, 0).setDisplaySize(p.w, GH - FLOOR_Y - 5).setDepth(1).setBlendMode('ADD');
      this.tweens.add({ targets: glow, alpha: { from: 0.75, to: 1 }, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      pg.lineStyle(2, 0xff5533, 0.9); pg.lineBetween(p.x, GH - 3, p.x + p.w, GH - 3);
    });

    // Lichtkegel unter den Deckenlampen
    const lg = this.add.graphics().setDepth(1).setBlendMode('ADD');
    [240, 600, 960].forEach(lx => {
      lg.fillStyle(0xfff0d2, 0.035);
      lg.fillTriangle(lx - 18, CEIL_Y, lx + 18, CEIL_Y, lx + 170, FLOOR_Y);
      lg.fillTriangle(lx - 18, CEIL_Y, lx - 170, FLOOR_Y, lx + 170, FLOOR_Y);
    });

    const g = this.add.graphics().setDepth(9);
    this.statics.forEach(r => this._drawStatic(g, r));
    // Warnstreifen an Abgrundkanten
    floors.forEach(f => {
      this.pits.forEach(p => {
        if (Math.abs(f.x + f.w - p.x) < 1) this._hazard(g, f.x + f.w - 64, FLOOR_Y, 64);
        if (Math.abs(p.x + p.w - f.x) < 1) this._hazard(g, f.x, FLOOR_Y, 64);
      });
    });
    // Deckenlampen
    [240, 600, 960].forEach(lx => {
      g.fillStyle(0x11161b); g.fillRect(lx - 22, CEIL_Y - 4, 44, 8);
      g.fillStyle(0xfff3dc); g.fillRect(lx - 18, CEIL_Y + 1, 36, 3);
    });
  }

  _drawStatic(g, r) {
    const { x, y, w, h, kind } = r;
    g.fillStyle(0x1b2228); g.fillRect(x, y, w, h);
    g.lineStyle(1, 0x10151a, 1);
    if (kind === 'wall') {
      for (let ty = y + 60; ty < y + h; ty += 60) g.lineBetween(x, ty, x + w, ty);
      g.fillStyle(0x2a333b); g.fillRect(kind === 'wall' && x === 0 ? x + w - 4 : x, y, 4, h);
    } else if (kind === 'ceil') {
      for (let tx = x + 80; tx < x + w; tx += 80) g.lineBetween(tx, y, tx, y + h);
      g.fillStyle(0x2b343c); g.fillRect(x, y + h - 6, w, 6);
    } else {
      g.fillStyle(COL.STEEL); g.fillRect(x, y, w, h);
      for (let tx = x + 60; tx < x + w; tx += 60) g.lineBetween(tx, y + 8, tx, y + h);
      g.fillStyle(COL.STEEL_HI); g.fillRect(x, y, w, 5);
      g.fillStyle(0x5d6b78);     g.fillRect(x, y, w, 1);
      g.fillStyle(0x10151a, 0.6); g.fillRect(x, y + 5, w, 3);
      g.fillStyle(0x3a4652);
      for (let tx = x + 12; tx < x + w - 6; tx += 30) g.fillCircle(tx, y + 14, 1.5);
    }
    g.lineStyle(2, OUTLINE, 1); g.strokeRect(x, y, w, h);
  }

  _hazard(g, x, y, w) {
    for (let i = 0; i < w; i += 8) {
      g.fillStyle((i / 8) % 2 ? 0x111111 : COL.AMBER, 0.95);
      g.fillRect(x + i, y, Math.min(8, w - i), 5);
    }
    g.fillStyle(COL.DANGER, 0.9); g.fillRect(x + w / 2 - 3, y + 12, 6, 4);
  }

  // ── Veränderbare Bauteile ────────────────────────────────────────────────────
  _buildStateful(L) {
    const deco = this.add.graphics().setDepth(4);
    const mk = (x, y, w, h, type) => {
      const po = {
        id: this.platObjects.length, type, seed: this.platObjects.length * 7 + 3,
        origW: w, origH: h, w, h, cx: x + w / 2, cy: y + h / 2,
        state: 'solid', frozen: false, frozenAngle: 0,
        sprite: null, img: null, collider: null,
        gfx: this.add.graphics().setDepth(5),
      };
      po.sprite = this._staticBody(po.cx, po.cy, w, h);
      this._redrawSolid(po);
      this.platObjects.push(po);
      return po;
    };
    L.plats.forEach(p => mk(p.x, p.y, p.w, 20, 'plat'));
    L.cols.forEach(c => {
      mk(c.x, c.y, 22, c.h, 'column');
      if (c.y <= CEIL_Y + 1) { // Halterung an der Decke
        deco.fillStyle(0x11161b); deco.fillRect(c.x - 6, CEIL_Y - 2, 34, 8);
        deco.lineStyle(2, OUTLINE); deco.strokeRect(c.x - 6, CEIL_Y - 2, 34, 8);
        deco.fillStyle(COL.HOT, 0.8); deco.fillRect(c.x + 8, CEIL_Y + 1, 6, 2);
      }
    });
  }

  _staticBody(cx, cy, w, h) {
    return this.platGroup.create(cx, cy, 'px').setVisible(false).setDisplaySize(w, h).refreshBody();
  }

  _redrawSolid(po) {
    po.gfx.clear().setPosition(po.cx, po.cy).setAngle(0).setAlpha(1).setVisible(true).setDepth(5);
    if (po.frozen) drawFrozen(po.gfx, po.w, po.h, po.seed);
    else           drawStateful(po.gfx, po.w, po.h, po.type === 'column');
  }

  // ── Effekte ──────────────────────────────────────────────────────────────────
  _buildFx() {
    const P = (tex, cfg, depth) => this.add.particles(0, 0, tex, Object.assign({ emitting: false }, cfg)).setDepth(depth);
    this.fx = {
      dust:    P('dot', { lifespan: { min: 250, max: 450 }, speed: { min: 20, max: 90 }, angle: { min: 200, max: 340 }, scale: { start: 0.8, end: 0 }, alpha: { start: 0.5, end: 0 }, tint: 0xc8ccc8, gravityY: -40 }, 19),
      spark:   P('dot', { lifespan: { min: 250, max: 600 }, speed: { min: 80, max: 280 }, scale: { start: 0.6, end: 0 }, tint: [0xff9900, 0xffcc33, 0xff5a00], gravityY: 400, blendMode: 'ADD' }, 31),
      ice:     P('shard', { lifespan: { min: 400, max: 800 }, speed: { min: 60, max: 240 }, scale: { start: 1, end: 0.2 }, alpha: { start: 1, end: 0 }, rotate: { min: 0, max: 360 }, tint: [0xbff4ff, 0x7fdcff, 0xffffff], gravityY: 500 }, 31),
      drip:    P('dot', { lifespan: 700, speed: { min: 0, max: 25 }, angle: { min: 80, max: 100 }, scale: { start: 0.45, end: 0.15 }, tint: 0xff7a1a, gravityY: 900, blendMode: 'ADD' }, 7),
      ember:   P('dot', { lifespan: { min: 1200, max: 2200 }, speed: { min: 20, max: 60 }, angle: { min: 255, max: 285 }, scale: { start: 0.55, end: 0 }, alpha: { start: 0.9, end: 0 }, tint: [0xff4422, 0xff9900], blendMode: 'ADD' }, 2),
      exit:    P('dot', { lifespan: { min: 900, max: 1500 }, speed: { min: 15, max: 40 }, angle: { min: 262, max: 278 }, scale: { start: 0.45, end: 0 }, alpha: { start: 0.9, end: 0 }, tint: COL.EXIT, blendMode: 'ADD' }, 12),
      sparkle: P('dot', { lifespan: { min: 300, max: 600 }, speed: { min: 0, max: 8 }, scale: { start: 0.5, end: 0 }, tint: 0xffffff, blendMode: 'ADD' }, 6),
      burst:   P('sq',  { lifespan: { min: 500, max: 1000 }, speed: { min: 100, max: 380 }, scale: { start: 1.6, end: 0 }, tint: [0xffffff, 0xff6600, 0x00c8ff, 0xe6edf3], gravityY: 600 }, 31),
    };
  }

  _flash(color, alpha, dur) {
    const f = this.add.rectangle(GW / 2, GH / 2, GW, GH, color, alpha).setDepth(45);
    this.tweens.add({ targets: f, alpha: 0, duration: dur, onComplete: () => f.destroy() });
  }

  _ring(x, y, color) {
    const r = this.add.circle(x, y, 6).setStrokeStyle(2, color, 0.9).setDepth(19);
    this.tweens.add({ targets: r, scale: 3.2, alpha: 0, duration: 280, onComplete: () => r.destroy() });
  }

  // ── Ausgang ─────────────────────────────────────────────────────────────────
  _buildExit(e) {
    const g = this.add.graphics().setDepth(10);
    g.fillStyle(0x000000, 0.3); g.fillRect(e.x - 22, e.y - 70, 52, 70);
    g.fillStyle(0x1d252d); rr(g, e.x - 26, e.y - 76, 52, 76, 4);
    g.fillStyle(0x34404b); g.fillRect(e.x - 26, e.y - 76, 52, 6);
    g.lineStyle(2, OUTLINE); rr(g, e.x - 26, e.y - 76, 52, 76, 4, true);
    g.fillStyle(0x03140c); g.fillRect(e.x - 18, e.y - 66, 36, 66);
    const pool = this.add.ellipse(e.x, e.y, 140, 18, COL.EXIT, 0.22).setDepth(3).setBlendMode('ADD');
    this.tweens.add({ targets: pool, alpha: { from: 0.12, to: 0.3 }, duration: 900, yoyo: true, repeat: -1 });
    this.add.text(e.x, e.y - 88, 'AUSGANG', { fontFamily: FONT, fontSize: '11px', fontStyle: 'bold', color: '#00ff88', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(11);
    this.exitField = this.add.graphics().setDepth(11);
    this.exitRect = { x: e.x - 16, y: e.y - 62, w: 32, h: 62 };
  }

  _updateExit() {
    const e = this.L.exit, g = this.exitField, t = this._t;
    g.clear();
    g.fillStyle(COL.EXIT, 0.22 + 0.06 * Math.sin(t * 3)); g.fillRect(e.x - 18, e.y - 66, 36, 66);
    for (let i = 0; i < 4; i++) {
      const y = e.y - ((t * 38 + i * 16.5) % 66);
      g.fillStyle(0x9dffd0, 0.45); g.fillRect(e.x - 18, y, 36, 2);
    }
    const o = Math.sin(t * 4) * 2;
    g.fillStyle(0xeafff4, 0.9);
    g.fillTriangle(e.x - 7 + o, e.y - 44, e.x - 7 + o, e.y - 22, e.x + 9 + o, e.y - 33);
    g.lineStyle(2, COL.EXIT, 0.9); g.strokeRect(e.x - 18, e.y - 66, 36, 66);
    if (Math.random() < 0.18) this.fx.exit.emitParticleAt(e.x + Phaser.Math.Between(-16, 16), e.y - 2, 1);
  }

  // ── Waffe zum Aufheben ──────────────────────────────────────────────────────
  _buildGunPickup(p) {
    const y = p.y - 26;
    const halo = this.add.graphics({ x: p.x, y }).setDepth(7).setBlendMode('ADD');
    halo.fillStyle(COL.ORANGE, 0.14); halo.fillCircle(0, 0, 30);
    halo.lineStyle(2, COL.ORANGE, 0.6);
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; halo.beginPath(); halo.arc(0, 0, 26, a, a + 0.6); halo.strokePath(); }
    this.tweens.add({ targets: halo, angle: 360, duration: 4000, repeat: -1 });

    const g = this.add.graphics({ x: p.x, y }).setDepth(8);
    g.lineStyle(2, OUTLINE);
    g.fillStyle(0xffc21a); rr(g, -18, -7, 30, 13, 3); rr(g, -18, -7, 30, 13, 3, true);
    g.fillStyle(COL.COLD); g.fillRect(-11, -5, 3, 9);
    g.fillStyle(0x9aa4ad); g.fillRect(11, -4, 12, 7); g.strokeRect(11, -4, 12, 7);
    g.fillStyle(0xffc21a); g.fillRect(-8, 5, 9, 9); g.strokeRect(-8, 5, 9, 9);
    g.fillStyle(COL.ORANGE); g.fillCircle(24, -0.5, 3.5);
    this.tweens.add({ targets: [g, halo], y: { from: y - 4, to: y + 4 }, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    const label = this.add.text(p.x, y - 40, 'STATE GUN', { fontFamily: FONT, fontSize: '12px', fontStyle: 'bold', color: '#ffcc00', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(9);
    this.tweens.add({ targets: label, alpha: { from: 1, to: 0.4 }, duration: 700, yoyo: true, repeat: -1 });
    this.gunPickup = { x: p.x, y, objs: [g, halo, label] };
  }

  // ── HUD (in der Deckenleiste) ───────────────────────────────────────────────
  _buildHUD() {
    const g = this.add.graphics().setDepth(50);
    g.fillStyle(0x0b1016, 0.88); rr(g, 28, 8, GW - 56, 39, 6);
    g.lineStyle(1, COL.ORANGE, 0.35); rr(g, 28, 8, GW - 56, 39, 6, true);
    const T = (x, y, s, size, color, ox = 0) => this.add.text(x, y, s, { fontFamily: FONT, fontSize: size, color, fontStyle: 'bold' }).setOrigin(ox, 0.5).setDepth(52);

    T(44, 27, 'KAMMER', '11px', '#7f93a4');
    T(98, 27, String(this.levelNum).padStart(2, '0'), '22px', '#ff9900');
    T(136, 27, this.L.name, '13px', '#c3d0db');
    this.hudDeaths = T(440, 27, '', '13px', '#c3d0db');
    this.hudTime   = T(560, 27, '', '13px', '#c3d0db');
    this.hudGfx    = this.add.graphics().setDepth(51);
    this.hudGun    = T(728, 27, '', '12px', '#ff9900');
    this.hudFreeze = T(950, 27, '', '12px', '#00c8ff', 0.5);
    this.hudSound  = T(GW - 56, 27, '', '16px', '#c3d0db', 0.5);
    this.soundZone = { x: GW - 80, y: 8, w: 52, h: 40 };

    this.hintTxt = this.add.text(GW / 2, 84, '', {
      fontFamily: FONT, fontSize: '15px', color: '#ffd27a', backgroundColor: 'rgba(8,12,18,0.86)', padding: { x: 14, y: 7 },
    }).setOrigin(0.5).setDepth(55).setAlpha(0);
  }

  _updateHUD() {
    this.hudDeaths.setText(`TODE ${this.deaths}`);
    this.hudTime.setText(`ZEIT ${this._levelTime.toFixed(1)}s`);
    this.hudSound.setText(SFX.muted ? '🔇' : '🔊');
    const g = this.hudGfx; g.clear();
    if (this.hasGun) {
      g.fillStyle(COL.ORANGE, 1); g.fillCircle(714, 27, 6);
      g.lineStyle(2, OUTLINE); g.strokeCircle(714, 27, 6);
      this.hudGun.setText('STATE GUN BEREIT').setColor('#ff9900');
      const hasLiquid = this.platObjects.some(po => po.state === 'liquid');
      const on = hasLiquid && this._freezeCD <= 0;
      g.fillStyle(on ? 0x0b5f80 : 0x111a22, 0.95); rr(g, 880, 15, 140, 24, 5);
      g.lineStyle(2, on ? COL.COLD : 0x2a3a48); rr(g, 880, 15, 140, 24, 5, true);
      this.hudFreeze.setText(TOUCH_UI ? '❄ ALLES FRIEREN' : '❄ ALLES  [F]').setColor(on ? '#bff4ff' : '#3c5468');
    } else {
      g.lineStyle(2, 0x5a4a2a); g.strokeCircle(714, 27, 6);
      this.hudGun.setText('KEINE WAFFE').setColor('#6d5a35');
      this.hudFreeze.setText('');
    }
  }

  _banner() {
    const a = this.add.text(GW / 2, 210, `KAMMER ${String(this.levelNum).padStart(2, '0')}`, {
      fontFamily: FONT, fontSize: '46px', fontStyle: 'bold', color: '#ff9900', stroke: '#000', strokeThickness: 7,
    }).setOrigin(0.5).setDepth(56);
    const b = this.add.text(GW / 2, 254, this.L.name, {
      fontFamily: FONT, fontSize: '18px', color: '#c3d0db', stroke: '#000', strokeThickness: 4, letterSpacing: 4,
    }).setOrigin(0.5).setDepth(56);
    if (this.retry) { a.destroy(); b.destroy(); return; }
    this.tweens.add({ targets: [a, b], alpha: 0, y: '-=12', delay: 1100, duration: 450, onComplete: () => { a.destroy(); b.destroy(); } });
  }

  _hint(key, force) {
    let msg = this.L.hints[key];
    if (!msg && key === 'lost') msg = 'Material verloren — {RESET} setzt die Kammer zurück';
    if (!msg || (this._hintsShown[key] && !force)) return;
    this._hintsShown[key] = true;
    this.tweens.killTweensOf(this.hintTxt);
    this.hintTxt.setText(hintText(msg)).setAlpha(0);
    this.tweens.add({ targets: this.hintTxt, alpha: 1, duration: 200 });
    this.tweens.add({ targets: this.hintTxt, alpha: 0, delay: 5200, duration: 500 });
  }

  // ── Eingabe ─────────────────────────────────────────────────────────────────
  _setupInput() {
    const K = Phaser.Input.Keyboard.KeyCodes;
    this.keys = this.input.keyboard.addKeys({
      left: K.LEFT, right: K.RIGHT, up: K.UP, a: K.A, d: K.D, w: K.W, space: K.SPACE, f: K.F,
    });
    this.input.mouse?.disableContextMenu();

    this.input.on('pointerdown', ptr => {
      const z = this.soundZone;
      if (ptr.x >= z.x && ptr.x <= z.x + z.w && ptr.y >= z.y && ptr.y <= z.y + z.h) { SFX.toggle(); return; }
      if (ptr.wasTouch) { this._touchAim = { x: ptr.worldX, y: ptr.worldY, t: this._t }; this._shoot(ptr.worldX, ptr.worldY); return; }
      if (ptr.rightButtonDown())     this._freezeAll();
      else if (ptr.leftButtonDown()) this._shoot(ptr.worldX, ptr.worldY);
    });
    this.input.keyboard.on('keydown-R',   () => { if (!this.levelDone) this._restart(false); });
    this.input.keyboard.on('keydown-M',   () => SFX.toggle());
    this.input.keyboard.on('keydown-ESC', () => {
      if (this._leaving) return;
      this._leaving = true;
      this.cameras.main.fadeOut(200, 0, 0, 0);
      this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Menu'));
    });
  }

  _restart(died) {
    this.scene.restart({ level: this.levelNum, deaths: this.deaths, hasGun: this.hasGun, retry: died || this.retry });
  }

  // ── Raycast ─────────────────────────────────────────────────────────────────
  _raycast(ox, oy, dx, dy) {
    let best = { t: 1500, kind: null, po: null };
    this.statics.forEach(r => {
      const h = rayAABB(ox, oy, dx, dy, r.x, r.y, r.x + r.w, r.y + r.h);
      if (h && h.t < best.t) best = { t: h.t, kind: 'block', po: null };
    });
    this.platObjects.forEach(po => {
      let h = null, kind = null;
      if (po.state === 'solid') {
        h = rayAABB(ox, oy, dx, dy, po.cx - po.w / 2, po.cy - po.h / 2, po.cx + po.w / 2, po.cy + po.h / 2);
        kind = 'solid';
      } else if (po.state === 'liquid' && po.img) {
        const c = po.img.body.center;
        h = rayAABB(ox, oy, dx, dy, c.x - po.lw / 2, c.y - po.lh / 2, c.x + po.lw / 2, c.y + po.lh / 2);
        if (h && h.inside) h = null; // Flüssigkeit, die gerade durch den Spieler fließt, nicht treffen
        kind = 'liquid';
      }
      if (h && h.t < best.t) best = { t: h.t, kind, po };
    });
    best.x = ox + dx * best.t; best.y = oy + dy * best.t;
    return best;
  }

  _muzzle() {
    const a = this.parm.rotation;
    return { x: this.parm.x + Math.cos(a) * 31, y: this.parm.y + Math.sin(a) * 31 };
  }

  // ── State Gun ───────────────────────────────────────────────────────────────
  _shoot(tx, ty) {
    if (!this.hasGun || this.levelDone || this.dead || this._shootCD > 0) return;
    const b = this.player.body;
    const ox = b.center.x, oy = b.center.y;
    const dx = tx - ox, dy = ty - oy, len = Math.hypot(dx, dy);
    if (len < 1) return;
    this._shootCD = 0.12;
    this._aimAngle = Math.atan2(dy, dx);
    this._updatePlayerVisual(0);
    const hit = this._raycast(ox, oy, dx / len, dy / len);
    const m = this._muzzle();
    if (hit.kind === 'liquid') {
      this._beam(m.x, m.y, hit.x, hit.y, COL.COLD);
      this._freeze(hit.po);
    } else if (hit.kind === 'solid') {
      this._beam(m.x, m.y, hit.x, hit.y, COL.ORANGE);
      this._liquefy(hit.po, dx >= 0 ? 1 : -1);
    } else {
      this._beam(m.x, m.y, hit.x, hit.y, 0x8a7a55);
      this.fx.spark.explode(4, hit.x, hit.y);
      SFX.play('miss');
    }
  }

  _beam(x1, y1, x2, y2, color) {
    const g = this.beamGfx;
    this.tweens.killTweensOf(g);
    g.clear().setAlpha(1);
    for (let i = 4; i >= 1; i--) { g.lineStyle(i * 3, color, 0.05 + i * 0.05); g.lineBetween(x1, y1, x2, y2); }
    // leicht zackiger Energiekern
    const L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.floor(L / 26));
    const nx = -(y2 - y1) / (L || 1), ny = (x2 - x1) / (L || 1);
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const k = i / n, j = (i === 0 || i === n) ? 0 : Phaser.Math.FloatBetween(-3, 3);
      pts.push({ x: x1 + (x2 - x1) * k + nx * j, y: y1 + (y2 - y1) * k + ny * j });
    }
    g.lineStyle(2, 0xffffff, 0.95); g.strokePoints(pts);
    g.fillStyle(color, 0.9); g.fillCircle(x2, y2, 6);
    g.fillStyle(0xffffff, 0.9); g.fillCircle(x1, y1, 4);
    this.tweens.add({ targets: g, alpha: 0, duration: 200, onComplete: () => g.clear() });
  }

  _liquefy(po, dirX) {
    if (po.state !== 'solid') return;
    po.state = 'liquid';
    po.sprite.destroy(); po.sprite = null;
    const isCol = po.type === 'column';

    const img = this.physics.add.image(po.cx, po.cy, 'px').setVisible(false);
    const b = img.body;
    b.setAllowGravity(true);
    if (isCol) {
      // Bereits liegende Säule bleibt liegen; stehende kippt in Schussrichtung
      po.tipAngle  = po.frozenAngle;
      po.tipTarget = po.frozenAngle !== 0 ? po.frozenAngle : 90 * dirX;
      b.setMaxVelocity(1000, CFG.COLUMN_MAX_FALL);
      b.setVelocityX(po.frozenAngle !== 0 ? 0 : dirX * CFG.COLUMN_DRIFT);
      b.setImmovable(true);   // Spieler kann darauf mitfahren, schiebt sie aber nicht
      po.img = img;
      po.collider = this.physics.add.collider(this.player, img);
      this._updateColumnShape(po);
    } else {
      po.lw = po.w; po.lh = po.h;
      po.maxW = Math.max(po.w, po.origW * 2.0);   // kein Aufschaukeln bei mehrfachem Verflüssigen
      po.minH = 14;
      b.setMaxVelocity(1000, CFG.LIQUID_MAX_FALL);
      b.setVelocityX(dirX * 12);
      b.setSize(po.lw, po.lh, true);
    }
    po.img = img;
    po.gfx.setDepth(8);

    this.cameras.main.shake(80, 0.003);
    this.fx.spark.explode(18, po.cx, po.cy);
    SFX.play('shoot'); SFX.play('liquefy');
    this._hint('liquefy');
  }

  _updateColumnShape(po) {
    const rad = Math.abs(po.tipAngle) * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);
    po.lw = po.origW * c + po.origH * s;
    po.lh = po.origW * s + po.origH * c;
    po.img.body.setSize(po.lw, po.lh, true);
  }

  _freeze(po) {
    if (po.state !== 'liquid' || !po.img) return;
    const c = po.img.body.center;
    let cx = c.x, cy = c.y, w, h, residual = 0;
    if (po.type === 'column') {
      const a = po.tipAngle;
      if (Math.abs(a) >= 45) { w = po.origH; h = po.origW; po.frozenAngle = 90 * Math.sign(a); }
      else                   { w = po.origW; h = po.origH; po.frozenAngle = 0; }
      residual = a - po.frozenAngle;   // Restwinkel wird optisch "eingerastet"
    } else {
      w = po.lw; h = Math.max(14, po.lh);
    }

    // Einrasten auf Boden-/Simshöhe, wenn knapp daneben (verhindert kleine Stufen)
    let top = cy - h / 2;
    const near = this.statics.filter(r => (r.kind === 'floor' || r.kind === 'block')
      && cx + w / 2 > r.x - 250 && cx - w / 2 < r.x + r.w + 250);
    for (const r of near) {
      if (Math.abs(top - r.y) <= CFG.FREEZE_SNAP) { cy += r.y - top; top = r.y; break; }
    }

    if (po.collider) { po.collider.destroy(); po.collider = null; }
    po.img.destroy(); po.img = null;
    po.cx = cx; po.cy = cy; po.w = w; po.h = h;
    po.state = 'solid'; po.frozen = true;
    po.sprite = this._staticBody(cx, cy, w, h);
    this._redrawSolid(po);
    if (residual) {
      po.gfx.setAngle(residual);
      this.tweens.add({ targets: po.gfx, angle: 0, duration: 140, ease: 'Back.easeOut' });
    }
    this._unstickPlayer({ x: cx - w / 2, y: cy - h / 2, w, h });

    const flash = this.add.rectangle(cx, cy, w + 8, h + 8, 0xd8f6ff, 0.8).setDepth(25).setBlendMode('ADD');
    this.tweens.add({ targets: flash, alpha: 0, duration: 380, onComplete: () => flash.destroy() });
    this.fx.ice.explode(Math.min(30, 10 + Math.floor((w + h) / 12)), cx, cy);
    SFX.play('freeze');
    this._hint('freeze');
  }

  _freezeAll() {
    if (!this.hasGun || this._freezeCD > 0 || this.levelDone || this.dead) return;
    const liquids = this.platObjects.filter(po => po.state === 'liquid');
    if (!liquids.length) return;
    this._freezeCD = 0.4;
    this._flash(COL.COLD, 0.18, 320);
    this.cameras.main.shake(100, 0.004);
    liquids.forEach(po => this._freeze(po));
  }

  // Spieler steckt nach dem Einfrieren in einer Plattform? → auf eine freie Seite setzen
  _unstickPlayer(r) {
    const b = this.player.body;
    const pr = { x: b.x, y: b.y, w: b.width, h: b.height };
    if (!rectsOverlap(pr, r)) return;
    const free = rect => !this.statics.some(s => rectsOverlap(rect, s, -1))
      && !this.platObjects.some(po => po.state === 'solid' && po.sprite && rectsOverlap(rect, { x: po.cx - po.w / 2, y: po.cy - po.h / 2, w: po.w, h: po.h }, -1));
    const candidates = [
      { x: pr.x, y: r.y - pr.h - 0.5 },
      { x: pr.x, y: r.y + r.h + 0.5 },
      { x: r.x - pr.w - 0.5, y: pr.y },
      { x: r.x + r.w + 0.5, y: pr.y },
    ].sort((a, b2) => (Math.abs(a.x - pr.x) + Math.abs(a.y - pr.y)) - (Math.abs(b2.x - pr.x) + Math.abs(b2.y - pr.y)));
    const pick = candidates.find(c => free({ x: c.x, y: c.y, w: pr.w, h: pr.h })) || candidates[0];
    b.reset(pick.x + pr.w / 2, pick.y + pr.h / 2);
  }

  // ── Update ──────────────────────────────────────────────────────────────────
  update(time, delta) {
    const dt = Math.min(delta, 50) / 1000;  // kein Sprung nach Tab-Wechsel
    this._t += dt;
    this._freezeCD -= dt; this._shootCD -= dt;

    if (MOBILE.reset) { MOBILE.reset = false; if (!this.levelDone) { this._restart(false); return; } }

    this._updateLiquids(dt);
    this._updateExit();
    this._ambientFx();

    if (!this.dead && !this.levelDone) {
      this._levelTime += dt;
      this._move(dt);
      this._stepAssist();
      this._checkGunPickup();
      this._checkExit();
      this._checkFall();
      const fz = this.keys.f.isDown || MOBILE.freeze;
      if (fz && !this._prevFreeze) this._freezeAll();
      this._prevFreeze = fz;
    }
    this._updatePlayerVisual(dt);
    this._updateAim();
    this._updateHUD();
  }

  _move(dt) {
    const k = this.keys, b = this.player.body;
    const left  = k.left.isDown || k.a.isDown || MOBILE.left;
    const right = k.right.isDown || k.d.isDown || MOBILE.right;
    const jump  = k.up.isDown || k.w.isDown || k.space.isDown || MOBILE.jump;
    const grounded = b.blocked.down || b.touching.down;   // touching: auf fallender Säule

    const vx = left && !right ? -CFG.SPEED : right && !left ? CFG.SPEED : 0;
    b.setVelocityX(vx);
    if (vx) this.facing = Math.sign(vx);

    if (grounded) { this._coyote = CFG.COYOTE_MS / 1000; this._airJumps = 1; }
    else this._coyote -= dt;

    const pressed = jump && !this._jumpHeld;
    this._jumpHeld = jump;
    if (pressed) this._jumpBuf = CFG.JUMP_BUFFER_MS / 1000; else this._jumpBuf -= dt;

    if (this._jumpBuf > 0) {
      if (this._coyote > 0) {
        b.setVelocityY(CFG.JUMP);
        this._coyote = 0; this._jumpBuf = 0; this._jumping = true;
        this._sx = 0.8; this._sy = 1.2;
        this.fx.dust.explode(6, b.center.x, b.bottom);
        SFX.play('jump');
      } else if (pressed && this._airJumps > 0) {
        b.setVelocityY(CFG.JUMP * CFG.DJUMP);
        this._airJumps--; this._jumpBuf = 0; this._jumping = true;
        this._sx = 0.85; this._sy = 1.15;
        this._ring(b.center.x, b.bottom, 0xffffff);
        SFX.play('djump');
      }
    }
    if (this._jumping && !jump && b.velocity.y < 0) { b.setVelocityY(b.velocity.y * CFG.JUMP_CUT); this._jumping = false; }
    if (b.velocity.y >= 0) this._jumping = false;

    if (grounded && !this._wasGrounded && this._lastVy > 250) {
      const k2 = Math.min(1, this._lastVy / 900);
      this._sx = 1 + 0.3 * k2; this._sy = 1 - 0.25 * k2;
      this.fx.dust.explode(4 + Math.floor(k2 * 8), b.center.x, b.bottom);
      SFX.play('land');
    }
    this._wasGrounded = grounded;
    this._lastVy = b.velocity.y;
  }

  // Kleine Kanten (bis 12 px) automatisch hochsteigen statt hängen zu bleiben
  _stepAssist() {
    const b = this.player.body;
    const dir = b.velocity.x > 0 ? 1 : b.velocity.x < 0 ? -1 : 0;
    if (!dir || !(b.blocked.down || b.touching.down)) return;
    if (!(dir > 0 ? b.blocked.right : b.blocked.left)) return;
    const feet = b.bottom, edgeX = dir > 0 ? b.right : b.x;
    const rects = [...this.statics, ...this.platObjects.filter(po => po.state === 'solid')
      .map(po => ({ x: po.cx - po.w / 2, y: po.cy - po.h / 2, w: po.w, h: po.h }))];
    const step = rects.find(r => r.y < feet - 0.5 && r.y >= feet - 12
      && (dir > 0 ? Math.abs(r.x - edgeX) < 3 : Math.abs(r.x + r.w - edgeX) < 3));
    if (!step) return;
    const nx = b.center.x + dir * 3, ny = step.y - b.height / 2 - 0.5;
    const probe = { x: nx - b.width / 2, y: ny - b.height / 2, w: b.width, h: b.height };
    if (rects.some(r => rectsOverlap(probe, r, -1))) return;
    b.reset(nx, ny);
    b.setVelocityX(dir * CFG.SPEED);
  }

  _updateLiquids(dt) {
    this.platObjects.forEach(po => {
      if (po.state === 'solid') {
        if (po.frozen && Math.random() < 0.01 * (po.w + po.h) / 100)
          this.fx.sparkle.emitParticleAt(po.cx + Phaser.Math.FloatBetween(-po.w / 2, po.w / 2), po.cy + Phaser.Math.FloatBetween(-po.h / 2, po.h / 2), 1);
        return;
      }
      if (po.state !== 'liquid' || !po.img) return;
      const b = po.img.body;

      if (po.type === 'column') {
        const dir = Math.sign(po.tipTarget) || 1;
        if (Math.abs(po.tipAngle) < Math.abs(po.tipTarget)) {
          po.tipAngle += CFG.COLUMN_TIP_SPEED * dt * dir;
          if (Math.abs(po.tipAngle) > Math.abs(po.tipTarget)) po.tipAngle = po.tipTarget;
          this._updateColumnShape(po);
        }
        po.gfx.clear().setPosition(b.center.x, b.center.y).setAngle(po.tipAngle);
        drawLiquid(po.gfx, po.origW, po.origH, this._t, po.seed);
      } else {
        po.lw = Math.min(po.maxW, po.lw + 38 * dt);
        po.lh = Math.max(po.minH, po.lh - 10 * dt);
        b.setSize(po.lw, po.lh, true);
        po.gfx.clear().setPosition(b.center.x, b.center.y).setAngle(0);
        drawLiquid(po.gfx, po.lw, po.lh, this._t, po.seed);
      }
      if (Math.random() < 0.25) {
        this.fx.drip.emitParticleAt(b.center.x + Phaser.Math.FloatBetween(-po.lw / 2 + 4, po.lw / 2 - 4), b.center.y + po.lh / 2, 1);
      }

      // aus dem Bild gefallen → endgültig weg
      if (b.center.y - po.lh / 2 > GH + 20 || b.center.x < -200 || b.center.x > GW + 200) {
        if (po.collider) { po.collider.destroy(); po.collider = null; }
        po.img.destroy(); po.img = null;
        po.gfx.clear().setVisible(false);
        po.state = 'gone';
        this._hint('lost');
      }
    });
  }

  _ambientFx() {
    this.pits.forEach(p => {
      if (Math.random() < p.w / 1400) this.fx.ember.emitParticleAt(p.x + Math.random() * p.w, GH - 2, 1);
    });
  }

  _updatePlayerVisual(dt) {
    const b = this.player.body;
    const x = b.center.x, y = b.bottom;
    const grounded = b.blocked.down || b.touching.down;

    // Zielrichtung
    let aim;
    if (TOUCH_UI) {
      aim = this._touchAim && this._t - this._touchAim.t < 0.7 ? this._aimAngle : (this.facing > 0 ? 0 : Math.PI);
    } else if (this.hasGun) {
      const p = this.input.activePointer;
      aim = Math.atan2(p.worldY - (y - 27), p.worldX - x);
    } else aim = this.facing > 0 ? 0.35 : Math.PI - 0.35;
    if (this.hasGun) this.facing = Math.cos(aim) >= 0 ? 1 : -1;
    if (!this.hasGun) aim = this.facing > 0 ? 1.2 : Math.PI - 1.2;   // Arm hängt locker

    let frame = 'p_idle', bob = 0;
    if (!grounded) frame = b.velocity.y < 0 ? 'p_jump' : 'p_fall';
    else if (Math.abs(b.velocity.x) > 1) {
      this._runT += dt * 11;
      frame = Math.floor(this._runT) % 2 ? 'p_run1' : 'p_run2';
      bob = Math.floor(this._runT) % 2 ? -1 : 0;
    }
    this._sx += (1 - this._sx) * Math.min(1, dt * 12);
    this._sy += (1 - this._sy) * Math.min(1, dt * 12);

    this.pv.setTexture(frame).setPosition(x, y + bob).setFlipX(this.facing < 0).setScale(this._sx, this._sy);
    this.parm.setPosition(x - this.facing * 1, y - 27 * this._sy + bob)
      .setRotation(aim).setFlipY(Math.cos(aim) < 0);
    this._aimAngle = aim;
  }

  _updateAim() {
    this.aimGfx.clear(); this.xhGfx.clear(); this.aimLbl.setText('');
    if (TOUCH_UI) return;
    const p = this.input.activePointer, ax = p.worldX, ay = p.worldY;
    let col = 0xdddddd, label = '';
    if (this.hasGun && !this.dead && !this.levelDone) {
      const b = this.player.body;
      const ox = b.center.x, oy = b.center.y, dx = ax - ox, dy = ay - oy, L = Math.hypot(dx, dy);
      if (L > 1) {
        const hit = this._raycast(ox, oy, dx / L, dy / L);
        col = hit.kind === 'solid' ? COL.ORANGE : hit.kind === 'liquid' ? COL.COLD : 0x7a8590;
        const m = this._muzzle();
        this.aimGfx.lineStyle(2, col, hit.po ? 0.45 : 0.18);
        this._dashed(this.aimGfx, m.x, m.y, hit.x, hit.y);
        if (hit.po) {
          const pulse = 0.55 + 0.35 * Math.sin(this._t * 10);
          let r;
          if (hit.kind === 'liquid') { const c = hit.po.img.body.center; r = { x: c.x - hit.po.lw / 2, y: c.y - hit.po.lh / 2, w: hit.po.lw, h: hit.po.lh }; }
          else r = { x: hit.po.cx - hit.po.w / 2, y: hit.po.cy - hit.po.h / 2, w: hit.po.w, h: hit.po.h };
          this.aimGfx.lineStyle(2, col, pulse); rr(this.aimGfx, r.x - 4, r.y - 4, r.w + 8, r.h + 8, 5, true);
          label = hit.kind === 'solid' ? 'VERFLÜSSIGEN' : 'EINFRIEREN';
        }
      }
    }
    const g = this.xhGfx, S = 9, G = 5;
    g.lineStyle(3, 0x000000, 0.5);
    g.lineBetween(ax - S - G, ay, ax - G, ay); g.lineBetween(ax + G, ay, ax + S + G, ay);
    g.lineBetween(ax, ay - S - G, ax, ay - G); g.lineBetween(ax, ay + G, ax, ay + S + G);
    g.lineStyle(2, col, 0.95);
    g.lineBetween(ax - S - G, ay, ax - G, ay); g.lineBetween(ax + G, ay, ax + S + G, ay);
    g.lineBetween(ax, ay - S - G, ax, ay - G); g.lineBetween(ax, ay + G, ax, ay + S + G);
    g.fillStyle(col, 0.95); g.fillCircle(ax, ay, 2);
    if (label && this.levelNum <= 4) {
      this.aimLbl.setText(label).setColor(col === COL.COLD ? '#7fe3ff' : '#ffb347').setPosition(ax + 14, ay + 10);
    }
  }

  _dashed(g, x1, y1, x2, y2) {
    const L = Math.hypot(x2 - x1, y2 - y1); if (L < 1) return;
    const ux = (x2 - x1) / L, uy = (y2 - y1) / L, dash = 7, gap = 7;
    for (let s = (this._t * 40) % (dash + gap); s < L; s += dash + gap) {
      const e = Math.min(L, s + dash);
      g.lineBetween(x1 + ux * s, y1 + uy * s, x1 + ux * e, y1 + uy * e);
    }
  }

  // ── Zustände ────────────────────────────────────────────────────────────────
  _checkGunPickup() {
    const gp = this.gunPickup;
    if (this.hasGun || !gp) return;
    const b = this.player.body;
    if (Math.abs(b.center.x - gp.x) < 30 && Math.abs(b.center.y - gp.y) < 45) {
      this.hasGun = true;
      gp.objs.forEach(o => { this.tweens.killTweensOf(o); o.destroy(); });
      this.gunPickup = null;
      this.parm.setTexture('gunarm');
      this._flash(COL.ORANGE, 0.3, 300);
      this.cameras.main.shake(120, 0.004);
      this.fx.spark.explode(26, gp.x, gp.y);
      SFX.play('pickup');
      this._hint('gun');
    }
  }

  _checkExit() {
    const b = this.player.body;
    if (rectsOverlap({ x: b.x, y: b.y, w: b.width, h: b.height }, this.exitRect)) this._win();
  }

  _checkFall() {
    const b = this.player.body;
    if (b.y > GH + 10 || b.center.x < -40 || b.center.x > GW + 40) this._die();
  }

  _die() {
    if (this.dead || this.levelDone) return;
    this.dead = true;
    this.deaths++;
    const b = this.player.body;
    const x = b.center.x, y = Math.min(b.center.y, GH - 10);
    b.stop(); b.enable = false;
    this.pv.setVisible(false); this.parm.setVisible(false);
    this.fx.burst.explode(30, x, y);
    this.fx.spark.explode(20, x, y);
    this._flash(COL.DANGER, 0.35, 450);
    this.cameras.main.shake(220, 0.008);
    SFX.play('death');
    this.time.delayedCall(750, () => {
      this.cameras.main.fadeOut(180, 0, 0, 0);
      this.cameras.main.once('camerafadeoutcomplete', () => this._restart(true));
    });
  }

  _win() {
    if (this.levelDone || this.dead) return;
    this.levelDone = true;
    const next = this.levelNum + 1;
    Store.set('best', Math.max(Store.get('best', 1), next));
    const b = this.player.body;
    b.stop(); b.enable = false;
    this.tweens.add({ targets: [this.pv, this.parm], x: this.L.exit.x, alpha: 0, scaleX: 0.4, duration: 380, ease: 'Quad.easeIn' });
    this._flash(COL.EXIT, 0.25, 400);
    this.fx.exit.explode(30, this.L.exit.x, this.L.exit.y - 30);
    SFX.play('win');

    this.time.delayedCall(350, () => {
      const ov = this.add.graphics().setDepth(60).setAlpha(0);
      ov.fillStyle(0x000000, 0.72); ov.fillRect(0, 0, GW, GH);
      ov.fillStyle(0x0b1016, 0.95); rr(ov, GW / 2 - 260, GH / 2 - 105, 520, 210, 10);
      ov.lineStyle(3, COL.EXIT); rr(ov, GW / 2 - 260, GH / 2 - 105, 520, 210, 10, true);
      const txt = [
        this.add.text(GW / 2, GH / 2 - 52, 'TEST BESTANDEN', { fontFamily: FONT, fontSize: '50px', fontStyle: 'bold', color: '#00ff88', stroke: '#000', strokeThickness: 7 }),
        this.add.text(GW / 2, GH / 2 + 4, `KAMMER ${String(this.levelNum).padStart(2, '0')}  ·  ${this.L.name}`, { fontFamily: FONT, fontSize: '18px', color: '#ff9900' }),
        this.add.text(GW / 2, GH / 2 + 36, `ZEIT ${this._levelTime.toFixed(1)}s   ·   TODE GESAMT ${this.deaths}`, { fontFamily: FONT, fontSize: '14px', color: '#c3d0db' }),
        this.add.text(GW / 2, GH / 2 + 74, TOUCH_UI ? '[ TIPPEN → WEITER ]' : '[ KLICK / LEERTASTE → WEITER ]', { fontFamily: FONT, fontSize: '13px', color: '#7f93a4' }),
      ];
      txt.forEach(t => t.setOrigin(0.5).setDepth(61).setAlpha(0));
      this.tweens.add({ targets: [ov, ...txt], alpha: 1, duration: 250 });
      this.tweens.add({ targets: txt[3], alpha: { from: 1, to: 0.3 }, delay: 300, duration: 600, yoyo: true, repeat: -1 });

      const go = () => {
        if (this._leaving) return;
        this._leaving = true;
        this.cameras.main.fadeOut(260, 0, 0, 0);
        this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Game', { level: next, deaths: this.deaths, hasGun: true }));
      };
      this.time.delayedCall(450, () => {
        this.input.once('pointerdown', go);
        this.input.keyboard.once('keydown-SPACE', go);
        this.input.keyboard.once('keydown-ENTER', go);
      });
      this.time.delayedCall(3200, go);
    });
  }
}

// ─── Start ───────────────────────────────────────────────────────────────────
window.__game = new Phaser.Game({
  type: Phaser.AUTO,
  width: GW,
  height: GH,
  backgroundColor: '#07090c',
  parent: 'phaser-container',
  physics: { default: 'arcade', arcade: { gravity: { y: CFG.GRAVITY }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: GW, height: GH },
  input: { activePointers: 4 },
  audio: { noAudio: true },
  scene: [BootScene, MenuScene, GameScene],
});
</script>
</body>
