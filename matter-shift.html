<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>STATE GUN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #050d18;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ── Mobile virtual controls ────────────────────── */
    #ctrl {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      pointer-events: none;
      z-index: 999;
    }
    .btn {
      position: absolute;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 22px;
      font-weight: bold;
      user-select: none;
      pointer-events: all;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #btn-left   { left: 10px;  bottom: 70px; width: 60px; height: 60px; }
    #btn-right  { left: 80px;  bottom: 70px; width: 60px; height: 60px; }
    #btn-jump   { left: 150px; bottom: 70px; width: 70px; height: 60px; border-color: rgba(255,255,255,0.5); }
    #btn-freeze { right: 10px; bottom: 70px; width: 75px; height: 60px;
                  border-color: rgba(0,180,255,0.9); background: rgba(0,120,255,0.22); color: #00c8ff;
                  font-size: 28px; }
    #ctrl-hint {
      position: absolute;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-family: 'Courier New', monospace;
      font-size: 10px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="game-wrap">
  <div id="phaser-container"></div>
</div>

<!-- Mobile controls -->
<div id="ctrl">
  <div class="btn" id="btn-left">◀</div>
  <div class="btn" id="btn-right">▶</div>
  <div class="btn" id="btn-jump">▲</div>
  <div class="btn" id="btn-freeze">❄</div>
  <div id="ctrl-hint">← → Bewegen  ·  ▲ Springen  ·  Tippen: State Gun  ·  ❄ Einfrieren</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
'use strict';

// ─── Mobile detection ─────────────────────────────────────────────────────────
const IS_MOBILE = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (IS_MOBILE) document.getElementById('ctrl').style.display = 'block';

const MOBILE = { left: false, right: false, jump: false, freeze: false };

function bindBtn(id, stateKey) {
  const el = document.getElementById(id);
  if (!el) return;
  const down = () => MOBILE[stateKey] = true;
  const up   = () => MOBILE[stateKey] = false;
  el.addEventListener('touchstart', e => { e.preventDefault(); down(); }, { passive: false });
  el.addEventListener('touchend',   e => { e.preventDefault(); up();   }, { passive: false });
  el.addEventListener('touchcancel',e => { e.preventDefault(); up();   }, { passive: false });
}
bindBtn('btn-left',   'left');
bindBtn('btn-right',  'right');
bindBtn('btn-jump',   'jump');
bindBtn('btn-freeze', 'freeze');

// ─── SPIELER-KONFIG (hier anpassen) ──────────────────────────────────────────
const CFG = {
  SPEED:   236,    // Laufgeschwindigkeit
  JUMP:   -562,    // Sprunghöhe (negativer = höher)
  DJUMP:   0.8,    // Double Jump als Anteil des normalen Sprungs (0.5 = 50%)
  GRAVITY: 1342,   // Schwerkraft
};

// ─── Constants ───────────────────────────────────────────────────────────────
const GW = 1200, GH = 600;
const OL = 3;

const C = {
  BG:       0x494a48,
  GRID:     0x0d1c2c,
  PLAT:     0x2b3d50,
  PLAT_HI:  0x3a5165,
  PLAT_STR: 0xff6600,
  FLOOR:    0x1b2b3b,
  FLOOR_HI: 0x263849,
  CEIL:     0x16232f,
  WALL:     0x14202c,
  WALL_PNL: 0x1c2f3f,
  OUT:      0x000000,
  PLAYER:   0xe4ecf4,
  VISOR:    0x0088ff,
  SUIT_O:   0xff6600,
  SG_BEAM:  0xff9900,
  SG_COLD:  0x00c8ff,
  LIQUID:   0xff6600,
  LIQUID_D: 0xcc4400,
  FROZEN:   0x44aadd,
  EXIT:     0x00ff88,
  EXIT_DIM: 0x00994d,
  DANGER:   0xff2244,
  HUD_BG:   0x08121e,
  WHITE:    0xffffff,
  GUN_COL:  0xffcc00,
  ATMO:     0x9da19c,
};

// ─── Seeded RNG ───────────────────────────────────────────────────────────────
class RNG {
  constructor(seed) { this.s = ((seed % 2147483646) + 2147483646) % 2147483646 + 1; }
  next() { this.s = this.s * 16807 % 2147483647; return (this.s - 1) / 2147483646; }
  f(a, b) { return a + this.next() * (b - a); }
}

// ─── Ray vs AABB ─────────────────────────────────────────────────────────────
function rayAABB(ox, oy, dx, dy, x0, y0, x1, y1) {
  let tIn = -1e9, tOut = 1e9, nx = 0, ny = 0, nxO = 0, nyO = 0;
  if (Math.abs(dx) > 1e-9) {
    const t1 = (x0-ox)/dx, t2 = (x1-ox)/dx;
    if (t1<=t2){ if(t1>tIn){tIn=t1;nx=-1;ny=0;} if(t2<tOut){tOut=t2;nxO= 1;nyO=0;} }
    else       { if(t2>tIn){tIn=t2;nx= 1;ny=0;} if(t1<tOut){tOut=t1;nxO=-1;nyO=0;} }
  } else if (ox < x0 || ox > x1) return null;
  if (Math.abs(dy) > 1e-9) {
    const t1 = (y0-oy)/dy, t2 = (y1-oy)/dy;
    if (t1<=t2){ if(t1>tIn){tIn=t1;nx=0;ny=-1;} if(t2<tOut){tOut=t2;nxO=0;nyO= 1;} }
    else       { if(t2>tIn){tIn=t2;nx=0;ny= 1;} if(t1<tOut){tOut=t1;nxO=0;nyO=-1;} }
  } else if (oy < y0 || oy > y1) return null;
  if (tIn > tOut || tOut < 0) return null;
  const t = tIn >= 0 ? tIn : tOut;
  return { t, x: ox+dx*t, y: oy+dy*t, nx: tIn >= 0 ? nx : nxO, ny: tIn >= 0 ? ny : nyO };
}

// ─── Level generator ──────────────────────────────────────────────────────────
function makeLevel(num) {
  const rng     = new RNG(num * 97531 + 13);
  const FLOOR_Y = GH - 55;
  const CEIL_Y  = 55;
  const platforms = [];

  platforms.push({ x: 0,       y: 0, w: 20, h: GH, type: 'wall',  noState: true });
  platforms.push({ x: GW - 20, y: 0, w: 20, h: GH, type: 'wall',  noState: true });
  platforms.push({ x: 20, y: 0, w: GW - 40, h: CEIL_Y, type: 'ceil', noState: true });

  const gapW = rng.f(Math.min(110 + num*28, 380), Math.min(160 + num*44, 380));
  const gapX = rng.f(210, GW - 210 - gapW);

  platforms.push({ x: 20,          y: FLOOR_Y, w: gapX - 20,                h: 80, type: 'floor', noState: true });
  platforms.push({ x: gapX + gapW, y: FLOOR_Y, w: GW - 20 - (gapX + gapW), h: 80, type: 'floor', noState: true });

  platforms.push({ x: 40,       y: FLOOR_Y - 78, w: 150, h: 20, type: 'platform' });
  platforms.push({ x: GW - 190, y: FLOOR_Y - 78, w: 150, h: 20, type: 'platform' });

  for (let i = 0; i < 2 + Math.min(num, 10); i++) {
    const x = rng.f(Math.max(40, gapX - 80), Math.min(GW - 140, gapX + gapW + 80));
    const y = rng.f(CEIL_Y + 30, FLOOR_Y - 110);
    const w = rng.f(80, 160);
    platforms.push({ x, y, w, h: 20, type: 'platform' });
  }

  for (let i = 0; i < Math.max(0, Math.min(num, 8) - 1); i++) {
    platforms.push({
      x: rng.f(200, GW - 200),
      y: rng.f(CEIL_Y + 10, FLOOR_Y - 170),
      w: 22, h: rng.f(90, 200), type: 'column',
    });
  }

  // Gun pickup only in level 1
  const gunPos = (num === 1) ? { x: 210, y: FLOOR_Y - 28 } : null;

  return {
    platforms,
    playerStart: { x: 115,      y: FLOOR_Y - 130 },
    exitPos:     { x: GW - 115, y: FLOOR_Y - 128 },
    gunPos,
    floorY: FLOOR_Y,
  };
}

// ═══════════════════════════════════════════════════════════════════════════════
// MENU SCENE
// ═══════════════════════════════════════════════════════════════════════════════
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  create() {
    const g = this.add.graphics();
    g.fillStyle(C.BG); g.fillRect(0, 0, GW, GH);
    g.lineStyle(1, C.GRID);
    for (let x = 0; x <= GW; x += 80) g.lineBetween(x, 0, x, GH);
    for (let y = 0; y <= GH; y += 80) g.lineBetween(0, y, GW, y);
    g.lineStyle(3, C.SG_BEAM); g.strokeRect(14, 14, GW - 28, GH - 28);
    g.lineStyle(1, C.SG_COLD, 0.5); g.strokeRect(20, 20, GW - 40, GH - 40);
    g.fillStyle(C.SG_BEAM, 0.07); g.fillRect(0, 0, 60, GH);
    g.fillStyle(C.SG_COLD, 0.07); g.fillRect(GW - 60, 0, 60, GH);

    this._logo(GW / 2, GH * 0.27, 56);

    this.add.text(GW/2, GH*0.47, 'APERTURE', {
      fontFamily: 'Courier New,monospace', fontSize: '74px',
      color: '#ff9900', stroke: '#000', strokeThickness: 7,
    }).setOrigin(0.5);
    this.add.text(GW/2, GH*0.615, 'STATE GUN', {
      fontFamily: 'Courier New,monospace', fontSize: '44px',
      color: '#00c8ff', stroke: '#000', strokeThickness: 5,
    }).setOrigin(0.5);
    this.add.text(GW/2, GH*0.71, 'MOLECULAR DENSITY MANIPULATION', {
      fontFamily: 'Courier New,monospace', fontSize: '15px', color: '#7899bb',
    }).setOrigin(0.5);

    const hint = IS_MOBILE
      ? 'TIPPEN UM ZU STARTEN'
      : 'WASD/Arrows: Move  ·  Space: Jump  ·  LMB: Verflüssigen  ·  RMB: Einfrieren  ·  R: Reset';
    this.add.text(GW/2, GH*0.79, hint, {
      fontFamily: 'Courier New,monospace', fontSize: '12px', color: '#446680',
    }).setOrigin(0.5);

    const prompt = this.add.text(GW/2, GH*0.87, '[ TIPPEN ODER SPACE → TESTEN BEGINNEN ]', {
      fontFamily: 'Courier New,monospace', fontSize: '20px',
      color: '#ffffff', stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5);
    this.tweens.add({ targets: prompt, alpha: 0.15, duration: 720, yoyo: true, repeat: -1 });

    this.input.once('pointerdown', () => this.scene.start('Game', { level: 1 }));
    this.input.keyboard.once('keydown-SPACE', () => this.scene.start('Game', { level: 1 }));
  }

  _logo(cx, cy, r) {
    const g = this.add.graphics();
    g.lineStyle(3, C.SG_BEAM); g.strokeCircle(cx, cy, r);
    g.fillStyle(C.SG_BEAM, 0.12); g.fillCircle(cx, cy, r);
    // Molecular lattice spokes
    for (let i = 0; i < 6; i++) {
      const a = (i/6)*Math.PI*2;
      g.lineBetween(cx+Math.cos(a)*r*0.38, cy+Math.sin(a)*r*0.38, cx+Math.cos(a)*r, cy+Math.sin(a)*r);
      g.fillStyle(C.SG_COLD, 0.9);
      g.fillCircle(cx+Math.cos(a)*r*0.72, cy+Math.sin(a)*r*0.72, 4);
    }
    g.fillStyle(C.BG); g.fillCircle(cx, cy, r*0.32);
    g.lineStyle(3, C.SG_BEAM); g.strokeCircle(cx, cy, r*0.32);
    g.fillStyle(C.SG_COLD, 0.8); g.fillCircle(cx, cy, 6);
    this.tweens.add({ targets: g, angle: 360, duration: 14000, repeat: -1, ease: 'Linear' });
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// GAME SCENE
// ═══════════════════════════════════════════════════════════════════════════════
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init(data) {
    this.levelNum      = data.level  || 1;
    this.deaths        = data.deaths || 0;
    this.hasGun        = data.hasGun || false;
    this.levelDone      = false;
    this._jumpConsumed  = false;
    this._airJumpsLeft  = 0;
    this.platObjects   = [];   // { def, state, origCX, origCY, staticSprite, dynamicBody, visualGfx, liquidTween }
    this.liquidGroup   = null;
    this._freezeCooldown = false;
    this._prevMobileFreeze = false;
  }

  preload() {
    if (!this.textures.exists('px')) {
      const g = this.make.graphics({ add: false });
      g.fillStyle(0xffffff); g.fillRect(0,0,1,1);
      g.generateTexture('px',1,1); g.destroy();
    }
    if (!this.textures.exists('player')) this._makePlayerTex();
  }

  _makePlayerTex() {
    const g = this.make.graphics({ add: false });
    g.fillStyle(C.PLAYER); g.lineStyle(OL, C.OUT);
    g.fillRect(6,38,8,14);  g.strokeRect(6,38,8,14);
    g.fillRect(18,38,8,14); g.strokeRect(18,38,8,14);
    g.fillRect(7,16,18,24); g.strokeRect(7,16,18,24);
    g.fillStyle(C.SUIT_O);  g.fillRect(8,21,16,4);
    g.lineStyle(1,C.OUT);   g.strokeRect(8,21,16,4);
    g.fillStyle(C.PLAYER);  g.lineStyle(OL,C.OUT);
    g.fillRect(8,3,16,13);  g.strokeRect(8,3,16,13);
    g.fillStyle(C.VISOR);   g.fillRect(9,6,14,7);
    g.lineStyle(2,C.OUT);   g.strokeRect(9,6,14,7);
    g.fillStyle(0xffffff,0.35); g.fillRect(9,6,4,4);
    // Gun on arm
    g.fillStyle(C.GUN_COL); g.fillRect(24,20,11,8);
    g.lineStyle(2,C.OUT); g.strokeRect(24,20,11,8);
    g.fillStyle(C.SG_BEAM,0.9); g.fillRect(33,22,5,4);
    g.generateTexture('player',40,54); g.destroy();
  }

  create() {
    const lvl = makeLevel(this.levelNum);
    this.lvl = lvl;

    this._drawBG();

    this.platGroup       = this.physics.add.staticGroup();
    this.liquidGroup     = this.physics.add.group(); // alle liquid (kein player-collider)
    this.colLiquidGroup  = this.physics.add.group(); // nur columns (player kann draufstehen)

    const platGfxLayer = this.add.graphics().setDepth(5);

    lvl.platforms.forEach(p => {
      const gfx = this.add.graphics().setDepth(5);
      this._drawPlat(gfx, p);
      const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
      const sp = this.platGroup.create(cx, cy, 'px');
      sp.setVisible(false).setDisplaySize(p.w, p.h).refreshBody();
      this.platObjects.push({
        def: { ...p },
        state: 'solid',
        origCX: cx, origCY: cy,
        colOrigW: p.w,   // original column dims preserved across re-liquefies
        colOrigH: p.h,
        staticSprite: sp,
        dynamicBody: null,
        visualGfx: gfx,
        liquidTween: null,
      });
    });

    // No liquid-on-solid collider: platforms fall freely through everything.
    // Player uses RMB/F/❄ to freeze them at the right height.

    this._buildExit(lvl.exitPos);

    // Gun pickup (level 1 only, or player already has it)
    if (lvl.gunPos && !this.hasGun) {
      this._buildGunPickup(lvl.gunPos);
    }

    this.player = this.physics.add.sprite(lvl.playerStart.x, lvl.playerStart.y, 'player');
    this.player.body.setSize(20,50).setOffset(7,2);
    this.player.setDepth(20).setCollideWorldBounds(false);

    this.physics.add.collider(this.player, this.platGroup);
    // Only columns get player-collider so player can ride them (elevator)
    this.physics.add.collider(this.player, this.colLiquidGroup);

    this.beamGfx = this.add.graphics().setDepth(30);
    this.xhGfx   = this.add.graphics().setDepth(40);
    this.hudGfx  = this.add.graphics().setDepth(51);

    this._buildHUD();
    this._setupInput();

    // Tutorial hint for level 1
    if (this.levelNum === 1 && !this.hasGun) {
      this._showHint('Hol die STATE GUN! Laufe darüber.', 3500);
    }
  }

  // ── Background ──────────────────────────────────────────────────────────────
  _drawBG() {
    const g = this.add.graphics().setDepth(0);
    g.fillStyle(C.BG); g.fillRect(0,0,GW,GH);

    // Atmospheric ATMO (#9da19c) wash — subtle vertical gradient panels
    g.fillStyle(C.ATMO, 0.03); g.fillRect(0, 0, GW, GH);
    g.fillStyle(C.ATMO, 0.05); g.fillRect(GW*0.25, 0, GW*0.5, GH);
    g.fillStyle(C.ATMO, 0.03); g.fillRect(GW*0.35, 0, GW*0.3, GH);

    // Fine grid in ATMO tint
    g.lineStyle(1, C.ATMO, 0.07);
    for (let x=0;x<=GW;x+=80) g.lineBetween(x,0,x,GH);
    for (let y=0;y<=GH;y+=80) g.lineBetween(0,y,GW,y);

    // Horizontal accent lines
    g.lineStyle(1, C.ATMO, 0.12);
    for (let y=80;y<GH-60;y+=120) g.lineBetween(20,y,GW-20,y);

    // Outer frame — ATMO tinted border
    g.lineStyle(2, C.ATMO, 0.18); g.strokeRect(7,7,GW-14,GH-14);
    g.lineStyle(1, C.ATMO, 0.08); g.strokeRect(14,14,GW-28,GH-28);
  }

  // ── Platform drawing ─────────────────────────────────────────────────────────
  _drawPlat(g, p) {
    const {x,y,w,h,type} = p;
    if (type==='floor') {
      g.fillStyle(C.FLOOR); g.fillRect(x,y,w,h);
      g.lineStyle(1,0x172535);
      for (let tx=x;tx<x+w;tx+=40) g.lineBetween(tx,y,tx,y+h);
      for (let ty=y;ty<y+h;ty+=40) g.lineBetween(x,ty,x+w,ty);
      g.fillStyle(C.FLOOR_HI); g.fillRect(x,y,w,5);
      this._stripes(g,x,y,48,h,true);
      this._stripes(g,x+w-48,y,48,h,false);
      g.lineStyle(OL,C.OUT); g.strokeRect(x,y,w,h);
    } else if (type==='ceil') {
      g.fillStyle(C.CEIL); g.fillRect(x,y,w,h);
      g.lineStyle(1,0x0c1a28);
      for (let tx=x;tx<x+w;tx+=80) g.lineBetween(tx,y,tx,y+h);
      g.fillStyle(0xffffff,0.04); g.fillRect(x,y+h-5,w,5);
      g.lineStyle(OL,C.OUT); g.strokeRect(x,y,w,h);
    } else if (type==='wall') {
      g.fillStyle(C.WALL); g.fillRect(x,y,w,h);
      g.lineStyle(1,0x0a1824);
      for (let ty=y;ty<y+h;ty+=60) g.lineBetween(x,ty,x+w,ty);
      g.lineStyle(OL,C.OUT); g.strokeRect(x,y,w,h);
    } else if (type==='column') {
      g.fillStyle(C.WALL_PNL); g.fillRect(x,y,w,h);
      g.fillStyle(C.PLAT_HI);  g.fillRect(x,y,w,5);
      g.lineStyle(1,0x0a1824);
      for (let ty=y;ty<y+h;ty+=44) g.lineBetween(x,ty,x+w,ty);
      g.lineStyle(OL,C.OUT); g.strokeRect(x,y,w,h);
    } else {
      g.fillStyle(0x000000,0.35); g.fillRect(x+5,y+5,w,h);
      g.fillStyle(C.PLAT);  g.fillRect(x,y,w,h);
      g.fillStyle(C.PLAT_HI); g.fillRect(x,y,w,7);
      const panels = Math.max(2,Math.floor(w/44));
      g.lineStyle(1,0x1a2a3a);
      for (let i=1;i<panels;i++) {
        const px2 = x+Math.round((w/panels)*i);
        g.lineBetween(px2,y+2,px2,y+h-2);
      }
      g.fillStyle(C.PLAT_STR,0.85); g.fillRect(x,y,w,3);
      g.lineStyle(OL,C.OUT); g.strokeRect(x,y,w,h);
    }
  }

  _drawPlatLiquid(g, p) {
    const {x,y,w,h} = p;
    // molten glow layers
    for (let i=4;i>=1;i--) {
      g.fillStyle(C.LIQUID, 0.04 + i*0.04);
      g.fillRect(x - i*3, y - i*3, w + i*6, h + i*6);
    }
    g.fillStyle(C.LIQUID_D, 0.88); g.fillRect(x, y, w, h);
    // boiling surface lines
    g.lineStyle(2, C.LIQUID, 0.9);
    for (let tx = x+8; tx < x+w-4; tx += 14) {
      g.lineBetween(tx, y+2, tx+6, y+h-2);
    }
    g.fillStyle(C.SG_BEAM, 0.55); g.fillRect(x, y, w, 4);
    g.lineStyle(OL, C.OUT); g.strokeRect(x, y, w, h);
  }

  _drawPlatFrozen(g, p) {
    const {x,y,w,h} = p;
    // ice blue glow
    for (let i=3;i>=1;i--) {
      g.fillStyle(C.SG_COLD, 0.04 + i*0.03);
      g.fillRect(x - i*2, y - i*2, w + i*4, h + i*4);
    }
    g.fillStyle(0x1a4466, 0.92); g.fillRect(x, y, w, h);
    g.fillStyle(C.SG_COLD, 0.22); g.fillRect(x, y, w, h);
    // ice crystal lines
    g.lineStyle(1, C.SG_COLD, 0.6);
    for (let tx = x+6; tx < x+w; tx += 18) g.lineBetween(tx, y, tx-4, y+h);
    g.fillStyle(0xffffff, 0.18); g.fillRect(x, y, w, 3);
    g.lineStyle(OL, C.SG_COLD); g.strokeRect(x, y, w, h);
  }

  _stripes(g, sx, sy, sw, sh, l2r) {
    const W = sw/4;
    for (let i=0;i<4;i++) {
      g.fillStyle(i%2===(l2r?0:1)?C.DANGER:0x111111,0.82);
      g.fillRect(sx+i*W,sy,W,sh);
    }
  }

  // ── Exit ────────────────────────────────────────────────────────────────────
  _buildExit(pos) {
    const g = this.add.graphics().setDepth(6);
    g.fillStyle(C.EXIT,0.1);  g.fillEllipse(pos.x,pos.y+10,72,18);
    g.fillStyle(C.EXIT,0.25); g.fillRect(pos.x-22,pos.y-52,44,64);
    g.fillStyle(C.EXIT,0.75); g.fillRect(pos.x-18,pos.y-48,36,56);
    g.fillStyle(0xffffff,0.28); g.fillRect(pos.x-18,pos.y-48,11,56);
    g.lineStyle(OL+1,C.EXIT_DIM); g.strokeRect(pos.x-22,pos.y-52,44,64);
    g.lineStyle(2,C.EXIT); g.strokeRect(pos.x-24,pos.y-54,48,68);
    g.fillStyle(C.BG,0.85);
    g.fillTriangle(pos.x-11,pos.y-8,pos.x-11,pos.y-32,pos.x+11,pos.y-20);
    this.add.text(pos.x,pos.y+22,'EXIT',{
      fontFamily:'Courier New',fontSize:'11px',color:'#00ff88',stroke:'#000',strokeThickness:2,
    }).setOrigin(0.5).setDepth(7);
    this.tweens.add({targets:g,alpha:{from:0.85,to:1},duration:650,yoyo:true,repeat:-1});
  }

  // ── Gun pickup ───────────────────────────────────────────────────────────────
  _buildGunPickup(pos) {
    const g = this.add.graphics().setDepth(8);
    this._drawGunIcon(g, pos.x, pos.y);
    this.tweens.add({ targets: g, y: { from: -4, to: 4 }, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    const label = this.add.text(pos.x, pos.y - 28, 'STATE GUN', {
      fontFamily: 'Courier New', fontSize: '11px', color: '#ffcc00', stroke: '#000', strokeThickness: 2,
    }).setOrigin(0.5).setDepth(9);
    this.tweens.add({ targets: label, alpha: { from: 1, to: 0.3 }, duration: 700, yoyo: true, repeat: -1 });

    this._gunPickupGfx   = g;
    this._gunPickupLabel = label;
    this._gunPickupPos   = pos;
  }

  _drawGunIcon(g, cx, cy) {
    // Gun body
    g.fillStyle(C.GUN_COL, 0.95); g.fillRect(cx - 18, cy - 7, 36, 12);
    g.lineStyle(2, C.OUT);        g.strokeRect(cx - 18, cy - 7, 36, 12);
    // Barrel
    g.fillStyle(0xaaaaaa, 0.9); g.fillRect(cx + 14, cy - 4, 12, 6);
    g.lineStyle(2, C.OUT);      g.strokeRect(cx + 14, cy - 4, 12, 6);
    // Grip
    g.fillStyle(C.GUN_COL, 0.85); g.fillRect(cx - 8, cy + 5, 10, 10);
    g.lineStyle(2, C.OUT);         g.strokeRect(cx - 8, cy + 5, 10, 10);
    // Glow
    for (let i = 3; i >= 1; i--) {
      g.fillStyle(C.SG_BEAM, 0.06 + i * 0.04);
      g.fillRect(cx - 18 - i*4, cy - 7 - i*3, 36 + i*8, 12 + i*6);
    }
    // Energy crystal on barrel tip
    g.fillStyle(C.SG_BEAM, 0.9); g.fillCircle(cx + 26, cy - 1, 4);
    g.lineStyle(1, C.OUT);       g.strokeCircle(cx + 26, cy - 1, 4);
  }

  // ── HUD ─────────────────────────────────────────────────────────────────────
  _buildHUD() {

    this.chamberTxt = this.add.text(GW/2,GH-23,`CHAMBER  ${String(this.levelNum).padStart(2,'0')}`,{

        fontFamily:'Courier New',fontSize:'9px',color:'#3a5570',
      }).setOrigin(1,0).setDepth(52);

    this._hudFreezeLbl = this.add.text(175,GH-23,'FREEZE',{

  _updateHUD() {
    this.hudGfx.clear();
    this.deathTxt.setText(`DEATHS: ${this.deaths}`);

    if (this.hasGun) {
      // Gun indicator (orange dot)
      this.hudGfx.fillStyle(C.SG_BEAM, 0.95);
      this.hudGfx.fillCircle(80, GH-23, 9);
      this.hudGfx.lineStyle(2, C.OUT);
      this.hudGfx.strokeCircle(80, GH-23, 9);
      this._hudGunLbl.setText('BEREIT').setColor('#ff9900');

      // Freeze indicator
      const hasLiquid = this.platObjects.some(po => po.state === 'liquid');
      const freezeCol = this._freezeCooldown ? 0x224466 : (hasLiquid ? C.SG_COLD : 0x224466);
      this.hudGfx.fillStyle(freezeCol, 0.9);
      this.hudGfx.fillRoundedRect(160, GH-37, 72, 28, 6);
      this.hudGfx.lineStyle(2, this._freezeCooldown ? 0x224466 : (hasLiquid ? C.SG_COLD : 0x335566));
      this.hudGfx.strokeRoundedRect(160, GH-37, 72, 28, 6);
      this._hudFreezeLbl.setColor(this._freezeCooldown ? '#335566' : (hasLiquid ? '#00c8ff' : '#335566'));
    } else {
      this._hudGunLbl.setText('KEINE WAFFE').setColor('#443311');
      this._hudFreezeLbl.setColor('#223344');
    }
  }

  // ── Input ───────────────────────────────────────────────────────────────────
  _setupInput() {
    this.keys = this.input.keyboard.addKeys({
      left:  Phaser.Input.Keyboard.KeyCodes.LEFT,
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      up:    Phaser.Input.Keyboard.KeyCodes.UP,
      a:     Phaser.Input.Keyboard.KeyCodes.A,
      d:     Phaser.Input.Keyboard.KeyCodes.D,
      w:     Phaser.Input.Keyboard.KeyCodes.W,
      space: Phaser.Input.Keyboard.KeyCodes.SPACE,
    });

    if (this.input.mouse) { try { this.input.mouse.disableContextMenu(); } catch(e) {} }

    this.input.on('pointerdown', ptr => {
      if (IS_MOBILE) {
        // Tap on canvas = shoot state gun toward tap
        this._shootStateGun(ptr.x, ptr.y);
      } else {
        if (ptr.leftButtonDown())  this._shootStateGun(ptr.x, ptr.y);
        if (ptr.rightButtonDown()) this._freezeAll();
      }
    });

    this.input.keyboard.on('keydown-R', () => {
      this.scene.restart({ level: this.levelNum, deaths: this.deaths, hasGun: this.hasGun });
    });
    this.input.keyboard.on('keydown-F', () => this._freezeAll());
  }

  // ── State Gun: shoot ─────────────────────────────────────────────────────────
  // LMB/tap: if ray hits a LIQUID platform first → freeze just that one (Feature 3)
  //          if ray hits a SOLID platform → liquefy it (or re-liquefy if frozen, Feature 5)
  _shootStateGun(sx, sy) {
    if (!this.hasGun || this.levelDone) return;

    const px = this.player.x, py = this.player.y;
    const ddx = sx - px, ddy = sy - py;
    const len = Math.hypot(ddx, ddy);
    if (len < 1) return;
    const rdx = ddx/len, rdy = ddy/len;

    // Ray vs liquid platforms (current dynamic-body position + morphed size)
    let bestLiqT = Infinity, bestLiqIdx = -1;
    this.platObjects.forEach((po, idx) => {
      if (po.state !== 'liquid' || !po.dynamicBody) return;
      const cx = po.dynamicBody.x, cy = po.dynamicBody.y;
      const hw = po.currentW/2, hh = po.currentH/2;
      const hit = rayAABB(px, py, rdx, rdy, cx-hw, cy-hh, cx+hw, cy+hh);
      if (hit && hit.t < bestLiqT) { bestLiqT = hit.t; bestLiqIdx = idx; }
    });

    // Ray vs solid platforms (incl. frozen ones — Feature 5: re-liquefy)
    let bestSolT = Infinity, bestSolIdx = -1, bestSolHit = null;
    this.platObjects.forEach((po, idx) => {
      if (po.def.noState || po.state === 'liquid' || po.state === 'gone') return;
      const d = po.def;
      const hit = rayAABB(px, py, rdx, rdy, d.x, d.y, d.x+d.w, d.y+d.h);
      if (hit && hit.t < bestSolT) { bestSolT = hit.t; bestSolIdx = idx; bestSolHit = hit; }
    });

    // Liquid closer → targeted freeze
    if (bestLiqIdx >= 0 && bestLiqT < bestSolT) {
      const po = this.platObjects[bestLiqIdx];
      this._drawBeam(px, py, po.dynamicBody.x, po.dynamicBody.y, true);
      this._freezePlatform(po);
      return;
    }

    // Solid → liquefy (or re-liquefy frozen platform)
    if (bestSolIdx >= 0) {
      this._drawBeam(px, py, bestSolHit.x, bestSolHit.y, true);
      this._liquefyPlatform(bestSolIdx);
      return;
    }

    this._drawBeam(px, py, px + rdx*1200, py + rdy*1200, false);
  }

  // ── State Gun: liquefy ───────────────────────────────────────────────────────
  // Feature 6: type-based gravity + lateral drift + viscosity params
  _liquefyPlatform(idx) {
    const po = this.platObjects[idx];
    if (po.state !== 'solid') return;

    po.state = 'liquid';
    po.staticSprite.destroy();
    po.staticSprite = null;

    // Reset gfx transform (frozen platforms leave an offset)
    po.visualGfx.x = 0;
    po.visualGfx.y = 0;
    po.visualGfx.setAlpha(1);

    const cx = po.origCX, cy = po.origCY;
    const type = po.def.type;
    const isCol  = type === 'column';
    const isWide = po.def.w > 130;

    // Gravity: columns fall slowly so player can ride; wide slabs slow; normal medium
    const extraGrav = isCol ? -200 : isWide ? 70 : 200;

    // Lateral drift direction (columns tip in this direction)
    const driftDir = Math.random() < 0.5 ? 1 : -1;
    const drift = isCol
      ? driftDir * (30 + Math.random() * 20)
      : (Math.random() - 0.5) * 25;

    // Viscosity params — use colOrigW/H for columns to avoid swapped dims after re-freeze
    const baseW = isCol ? po.colOrigW : po.def.w;
    const baseH = isCol ? po.colOrigH : po.def.h;
    po.currentW = baseW;
    po.currentH = baseH;
    if (isCol) {
      // Columns tip — no spread, handled by rotation
      po.maxW = baseW;
      po.minH = baseH;
      po.spreadRate = 0;
      // Tipping animation: rotates toward horizontal over ~2.5s
      po.tipAngle  = 0;
      po.tipTarget = driftDir * 90;
      po.tipSpeed  = 36; // degrees per second
    } else if (isWide) {
      po.maxW = po.def.w * 2.4;
      po.minH = Math.max(6, po.def.h * 0.18);
      po.spreadRate = 50;
      po.tipAngle = null;
    } else {
      po.maxW = po.def.w * 2.0;
      po.minH = Math.max(6, po.def.h * 0.22);
      po.spreadRate = 38;
      po.tipAngle = null;
    }

    const img = this.physics.add.image(cx, cy, 'px');
    img.setVisible(false);
    img.setDisplaySize(po.currentW, po.currentH);
    img.body.setSize(po.currentW, po.currentH);
    img.body.setGravityY(extraGrav);
    img.body.setVelocityX(drift);
    img.body.setCollideWorldBounds(false);
    this.liquidGroup.add(img);
    if (isCol) this.colLiquidGroup.add(img);
    po.dynamicBody = img;

    if (po.liquidTween) { po.liquidTween.stop(); po.liquidTween = null; }
    po.liquidTween = this.tweens.add({
      targets: po.visualGfx,
      alpha: { from: 0.95, to: 0.55 },
      duration: 180, yoyo: true, repeat: -1, ease: 'Sine.easeInOut',
    });

    this.cameras.main.shake(80, 0.003);
    this._showHint('Tippen: Gezielt einfrieren  ·  RMB / ❄: Alle einfrieren', 2500);
  }

  // ── State Gun: freeze single platform ───────────────────────────────────────
  _freezePlatform(po) {
    if (po.state !== 'liquid' || !po.dynamicBody) return;

    const newCX = po.dynamicBody.x;
    const newCY = po.dynamicBody.y;
    const angle = po.tipAngle ?? 0;
    const absAngle = Math.abs(angle);

    // Column: decide final orientation from tip angle
    // >65° → horizontal bridge, 25-65° → diagonal ramp, <25° → near-vertical
    let frozenW = po.currentW;
    let frozenH = po.currentH;
    let frozenAngle = 0;

    if (po.def.type === 'column' && po.tipAngle !== null) {
      const origW = po.colOrigW, origH = po.colOrigH;
      if (absAngle > 65) {
        // Bridge: swap dimensions → wide horizontal platform
        frozenW = origH;
        frozenH = origW;
        frozenAngle = 0;
      } else if (absAngle > 25) {
        // Ramp: keep the visual angle, body is rectangular approximation
        frozenW = origH * 0.8;
        frozenH = origW * 0.8;
        frozenAngle = angle; // preserve tilt visually
      }
      // <25°: stays near-vertical, no dimension change
    }

    const newX = newCX - frozenW / 2;
    const newY = newCY - frozenH / 2;

    po.dynamicBody.destroy(); po.dynamicBody = null;
    if (po.liquidTween) { po.liquidTween.stop(); po.liquidTween = null; }

    // Reset gfx, apply frozen visual
    po.visualGfx.setAlpha(1).setScale(1);
    po.visualGfx.angle = frozenAngle;
    po.def.x = newX; po.def.y = newY;
    po.def.w = frozenW; po.def.h = frozenH;

    if (frozenAngle !== 0) {
      // Ramp: draw centered so rotation works
      po.visualGfx.x = newCX; po.visualGfx.y = newCY;
      po.visualGfx.clear();
      const hw = frozenW/2, hh = frozenH/2;
      for (let i=2;i>=1;i--) { po.visualGfx.fillStyle(C.SG_COLD,0.04+i*0.03); po.visualGfx.fillRect(-hw-i*2,-hh-i*2,frozenW+i*4,frozenH+i*4); }
      po.visualGfx.fillStyle(0x1a4466,0.92); po.visualGfx.fillRect(-hw,-hh,frozenW,frozenH);
      po.visualGfx.fillStyle(C.SG_COLD,0.22); po.visualGfx.fillRect(-hw,-hh,frozenW,frozenH);
      po.visualGfx.lineStyle(1,C.SG_COLD,0.5); for(let tx=-hw+6;tx<hw;tx+=18) po.visualGfx.lineBetween(tx,-hh,tx-4,hh);
      po.visualGfx.fillStyle(0xffffff,0.18); po.visualGfx.fillRect(-hw,-hh,frozenW,3);
      po.visualGfx.lineStyle(OL,C.SG_COLD); po.visualGfx.strokeRect(-hw,-hh,frozenW,frozenH);
    } else {
      po.visualGfx.x = 0; po.visualGfx.y = 0;
      po.visualGfx.clear();
      this._drawPlatFrozen(po.visualGfx, po.def);
    }

    // New static body
    const sp = this.platGroup.create(newCX, newCY, 'px');
    sp.setVisible(false).setDisplaySize(frozenW, frozenH).refreshBody();
    po.staticSprite = sp;
    po.origCX = newCX; po.origCY = newCY;
    po.state = 'solid';

    // Ice glow flash
    const ig = this.add.graphics().setDepth(25);
    ig.fillStyle(C.SG_COLD, 0.6); ig.fillRect(newX, newY, frozenW, frozenH);
    this.tweens.add({ targets: ig, alpha: 0, duration: 380, onComplete: () => ig.destroy() });
  }

  // ── State Gun: freeze all ────────────────────────────────────────────────────
  _freezeAll() {
    if (!this.hasGun || this._freezeCooldown || this.levelDone) return;
    const liquids = this.platObjects.filter(po => po.state === 'liquid');
    if (liquids.length === 0) return;

    this._freezeCooldown = true;
    const f = this.add.graphics().setDepth(45);
    f.fillStyle(C.SG_COLD, 0.25); f.fillRect(0, 0, GW, GH);
    this.tweens.add({ targets: f, alpha: 0, duration: 350, onComplete: () => f.destroy() });
    this.cameras.main.shake(100, 0.004);

    liquids.forEach(po => this._freezePlatform(po));
    this.time.delayedCall(600, () => { this._freezeCooldown = false; });
  }

  // ── Gun beam visual ──────────────────────────────────────────────────────────
  _drawBeam(x1, y1, x2, y2, hit) {
    this.beamGfx.clear();
    const col = hit ? C.SG_BEAM : 0x886600;
    for (let i = 4; i >= 1; i--) {
      this.beamGfx.lineStyle(i * 2.5, col, 0.06 + i * 0.06);
      this.beamGfx.lineBetween(x1, y1, x2, y2);
    }
    this.beamGfx.lineStyle(2, 0xffffff, 0.8);
    this.beamGfx.lineBetween(x1, y1, x2, y2);
    if (hit) {
      this.beamGfx.fillStyle(C.SG_BEAM, 0.9);
      this.beamGfx.fillCircle(x2, y2, 7);
    }
    this.tweens.add({
      targets: this.beamGfx, alpha: 0, duration: 160,
      onComplete: () => { this.beamGfx.setAlpha(1).clear(); },
    });
  }

  // ── Hint text ────────────────────────────────────────────────────────────────
  _showHint(msg, duration) {
    if (this._hintTxt) { this._hintTxt.destroy(); this._hintTween?.stop(); }
    this._hintTxt = this.add.text(GW/2, GH/2 - 80, msg, {
      fontFamily: 'Courier New', fontSize: '16px',
      color: '#ffcc00', stroke: '#000', strokeThickness: 3,
      backgroundColor: '#00000088', padding: { x: 12, y: 6 },
    }).setOrigin(0.5).setDepth(55);
    this._hintTween = this.tweens.add({
      targets: this._hintTxt, alpha: { from: 1, to: 0 },
      duration: 400, delay: duration - 400,
      onComplete: () => { this._hintTxt?.destroy(); this._hintTxt = null; },
    });
  }

  // ── Update loop ──────────────────────────────────────────────────────────────
  update(time, delta) {
    if (this.levelDone) return;
    this._move();
    this._updateLiquidVisuals(delta);
    this._cleanupFallenPlatforms();
    this._checkGunPickup();
    this._checkExit();
    this._checkFall();
    this._handleMobileFreeze();
    if (!IS_MOBILE) this._drawXhair();
    else            this.xhGfx.clear();
    this._updateHUD();
  }

  _move() {
    const SPEED=CFG.SPEED, JUMP=CFG.JUMP, DJUMP=CFG.JUMP*CFG.DJUMP;
    const k=this.keys, b=this.player.body;
    const left  = k.left.isDown  || k.a.isDown  || MOBILE.left;
    const right = k.right.isDown || k.d.isDown   || MOBILE.right;
    const jump  = k.up.isDown    || k.w.isDown   || k.space.isDown || MOBILE.jump;

    this.player.setVelocityX(left?-SPEED:right?SPEED:0);
    if (left)  this.player.setFlipX(true);
    if (right) this.player.setFlipX(false);

    if (b.blocked.down) this._airJumpsLeft = 1;

    if (jump && !this._jumpConsumed) {
      if (b.blocked.down) {
        this.player.setVelocityY(JUMP);
        this._jumpConsumed = true;
      } else if (this._airJumpsLeft > 0) {
        this.player.setVelocityY(DJUMP);
        this._airJumpsLeft--;
        this._jumpConsumed = true;
      }
    }
    if (!jump) this._jumpConsumed = false;
  }

  _handleMobileFreeze() {
    // Edge-trigger: fire once on press, not every frame
    if (MOBILE.freeze && !this._prevMobileFreeze) this._freezeAll();
    this._prevMobileFreeze = MOBILE.freeze;
  }

  // Feature 1: viscosity morphing + Column tipping
  _updateLiquidVisuals(delta) {
    const dt = delta / 1000;
    this.platObjects.forEach(po => {
      if (po.state !== 'liquid' || !po.dynamicBody) return;

      const cx = po.dynamicBody.x, cy = po.dynamicBody.y;

      if (po.def.type === 'column' && po.tipAngle !== null) {
        // Animate tip angle toward tipTarget
        const dir = po.tipTarget > 0 ? 1 : -1;
        po.tipAngle += po.tipSpeed * dt * dir;
        if (Math.abs(po.tipAngle) >= Math.abs(po.tipTarget))
          po.tipAngle = po.tipTarget;

        // Position gfx at body center, rotate around it
        po.visualGfx.x = cx;
        po.visualGfx.y = cy;
        po.visualGfx.angle = po.tipAngle;

        // Draw column centered at (0,0) so rotation is correct
        po.visualGfx.clear();
        const hw = po.def.w / 2, hh = po.def.h / 2;
        // Glow layers
        for (let i = 3; i >= 1; i--) {
          po.visualGfx.fillStyle(C.LIQUID, 0.04 + i * 0.04);
          po.visualGfx.fillRect(-hw - i*3, -hh - i*3, po.def.w + i*6, po.def.h + i*6);
        }
        po.visualGfx.fillStyle(C.LIQUID_D, 0.9);
        po.visualGfx.fillRect(-hw, -hh, po.def.w, po.def.h);
        po.visualGfx.fillStyle(C.SG_BEAM, 0.5);
        po.visualGfx.fillRect(-hw, -hh, po.def.w, 4);
        po.visualGfx.lineStyle(OL, C.OUT);
        po.visualGfx.strokeRect(-hw, -hh, po.def.w, po.def.h);
      } else {
        // Non-column: spread/flatten viscosity
        if (po.currentW < po.maxW)
          po.currentW = Math.min(po.maxW, po.currentW + po.spreadRate * dt);
        if (po.currentH > po.minH)
          po.currentH = Math.max(po.minH, po.currentH - po.spreadRate * 0.38 * dt);

        po.dynamicBody.body.setSize(po.currentW, po.currentH);
        po.dynamicBody.setDisplaySize(po.currentW, po.currentH);

        po.visualGfx.x = 0; po.visualGfx.y = 0;
        po.visualGfx.angle = 0;
        po.visualGfx.clear();
        this._drawPlatLiquid(po.visualGfx, {
          x: cx - po.currentW/2, y: cy - po.currentH/2,
          w: po.currentW, h: po.currentH,
        });
      }
    });
  }

  _cleanupFallenPlatforms() {
    this.platObjects.forEach(po => {
      if (po.state !== 'liquid' || !po.dynamicBody) return;
      if (po.dynamicBody.y > GH + 120) {
        // Fell off screen — remove cleanly
        po.dynamicBody.destroy(); po.dynamicBody = null;
        if (po.liquidTween) { po.liquidTween.stop(); po.liquidTween = null; }
        po.visualGfx.setVisible(false).setAlpha(1);
        po.visualGfx.x = 0; po.visualGfx.y = 0; po.visualGfx.angle = 0;
        po.state = 'gone';
      }
    });
  }

  _checkGunPickup() {
    if (this.hasGun || !this._gunPickupPos) return;
    const gp = this._gunPickupPos;
    if (Math.hypot(this.player.x - gp.x, this.player.y - gp.y) < 45) {
      this.hasGun = true;
      this._gunPickupGfx?.destroy();
      this._gunPickupLabel?.destroy();
      this._gunPickupPos = null;

      // Pickup flash
      const f = this.add.graphics().setDepth(45);
      f.fillStyle(C.SG_BEAM, 0.4); f.fillRect(0,0,GW,GH);
      this.tweens.add({ targets: f, alpha: 0, duration: 300, onComplete: () => f.destroy() });
      this.cameras.main.shake(120, 0.005);
      this._showHint('STATE GUN AUFGEHOBEN! LMB = Verflüssigen  ·  RMB/F/❄ = Einfrieren', 4000);
    }
  }

  _checkExit() {
    const ep = this.lvl.exitPos;
    if (Math.hypot(this.player.x-ep.x, this.player.y-ep.y) < 40) this._win();
  }

  _checkFall() {
    if (this.player.y > GH+80 || this.player.y < -80) {
      this.deaths++;
      this.scene.restart({ level: this.levelNum, deaths: this.deaths, hasGun: this.hasGun });
    }
  }

  _drawXhair() {
    this.xhGfx.clear();
    const {x,y} = this.input.activePointer;
    const col = this.hasGun ? C.SG_BEAM : C.WHITE;
    const S=11, G=5;
    this.xhGfx.lineStyle(2, col, 0.88);
    this.xhGfx.lineBetween(x-S-G,y,x-G,y); this.xhGfx.lineBetween(x+G,y,x+S+G,y);
    this.xhGfx.lineBetween(x,y-S-G,x,y-G); this.xhGfx.lineBetween(x,y+G,x,y+S+G);
    this.xhGfx.strokeCircle(x,y,3.5);
    if (this.hasGun) {
      // Small inner dot
      this.xhGfx.fillStyle(col, 0.9); this.xhGfx.fillCircle(x,y,2);
    }
  }

  _win() {
    if (this.levelDone) return;
    this.levelDone = true;
    const ov = this.add.graphics().setDepth(60);
    ov.fillStyle(0x000000,0.78); ov.fillRect(0,0,GW,GH);
    ov.lineStyle(3,C.EXIT); ov.strokeRect(GW/2-240,GH/2-90,480,180);
    this.add.text(GW/2,GH/2-40,'TEST PASSED',{
      fontFamily:'Courier New',fontSize:'58px',color:'#00ff88',stroke:'#000',strokeThickness:7,
    }).setOrigin(0.5).setDepth(61);
    this.add.text(GW/2,GH/2+22,`CHAMBER ${String(this.levelNum).padStart(2,'0')} CLEARED`,{
      fontFamily:'Courier New',fontSize:'22px',color:'#ff9900',stroke:'#000',strokeThickness:3,
    }).setOrigin(0.5).setDepth(61);
    this.time.delayedCall(2400,()=>{
      this.scene.start('Game',{level:this.levelNum+1, deaths:this.deaths, hasGun:true});
    });
  }
}

// ─── Bootstrap ───────────────────────────────────────────────────────────────
new Phaser.Game({
  type:            Phaser.CANVAS,
  width:           GW,
  height:          GH,
  backgroundColor: '#060c14',
  parent:          'phaser-container',
  physics: {
    default: 'arcade',
    arcade:  { gravity: { y: CFG.GRAVITY }, debug: false },
  },
  scale: {
    mode:       Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width:      GW,
    height:     GH,
  },
  scene: [MenuScene, GameScene],
  input: {
    activePointers: 4,
  },
});
</script>
